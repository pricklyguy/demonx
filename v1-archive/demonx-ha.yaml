###############################################################################
# DemonX CNC — Home Assistant Package
# File: packages/demonx.yaml
#
# Requires in configuration.yaml:
#   homeassistant:
#     packages:
#       demonx: !include packages/demonx.yaml
#
# Replace 10.10.1.31 with your DemonX server IP.
# All data sourced from DemonX server — no ESP32 bridge required.
###############################################################################


# ─────────────────────────────────────────────────────────────────────────────
# REST Sensors — polls /api/status every 2 seconds
# ─────────────────────────────────────────────────────────────────────────────
rest:
  - resource: http://10.10.1.31:8080/api/status
    scan_interval: 2
    timeout: 3

    sensor:
      - name: "CNC State"
        unique_id: demonx_cnc_state
        value_template: "{{ value_json.state }}"
        icon: mdi:robot-industrial

      - name: "CNC Work X"
        unique_id: demonx_cnc_wx
        value_template: "{{ value_json.wpos[0] | round(3) }}"
        unit_of_measurement: "mm"
        icon: mdi:alpha-x-circle-outline
        state_class: measurement

      - name: "CNC Work Y"
        unique_id: demonx_cnc_wy
        value_template: "{{ value_json.wpos[1] | round(3) }}"
        unit_of_measurement: "mm"
        icon: mdi:alpha-y-circle-outline
        state_class: measurement

      - name: "CNC Work Z"
        unique_id: demonx_cnc_wz
        value_template: "{{ value_json.wpos[2] | round(3) }}"
        unit_of_measurement: "mm"
        icon: mdi:alpha-z-circle-outline
        state_class: measurement

      - name: "CNC X Position"
        unique_id: demonx_cnc_x
        value_template: "{{ value_json.mpos[0] | round(3) }}"
        unit_of_measurement: "mm"
        icon: mdi:alpha-x-box-outline
        state_class: measurement

      - name: "CNC Y Position"
        unique_id: demonx_cnc_y
        value_template: "{{ value_json.mpos[1] | round(3) }}"
        unit_of_measurement: "mm"
        icon: mdi:alpha-y-box-outline
        state_class: measurement

      - name: "CNC Z Position"
        unique_id: demonx_cnc_z
        value_template: "{{ value_json.mpos[2] | round(3) }}"
        unit_of_measurement: "mm"
        icon: mdi:alpha-z-box-outline
        state_class: measurement

      - name: "CNC Feed Rate"
        unique_id: demonx_cnc_feed
        value_template: "{{ value_json.feed }}"
        unit_of_measurement: "mm/min"
        icon: mdi:speedometer
        state_class: measurement

      - name: "CNC Spindle RPM"
        unique_id: demonx_cnc_spindle
        value_template: "{{ value_json.rpm }}"
        unit_of_measurement: "RPM"
        icon: mdi:rotate-3d-variant
        state_class: measurement

      - name: "DemonX Viewers"
        unique_id: demonx_viewers
        value_template: "{{ value_json.clients }}"
        icon: mdi:monitor-multiple

    binary_sensor:
      - name: "DemonX Online"
        unique_id: demonx_online
        value_template: "{{ value_json.connected }}"
        device_class: connectivity


# ─────────────────────────────────────────────────────────────────────────────
# Template Sensors & Binary Sensors
# ─────────────────────────────────────────────────────────────────────────────
template:
  - sensor:
      - name: "DemonX State Label"
        unique_id: demonx_state_label
        icon: mdi:robot-industrial
        state: >-
          {% set s = states('sensor.cnc_state') %}
          {% if   s == 'Run'   %} Running
          {% elif s == 'Jog'   %} Jogging
          {% elif s == 'Idle'  %} Idle
          {% elif s == 'Alarm' %} ALARM
          {% elif s == 'Hold'  %} Feed Hold
          {% elif s == 'Home'  %} Homing
          {% elif s == 'Sleep' %} Sleep
          {% else %}               Offline
          {% endif %}

      - name: "DemonX Feed Rate Display"
        unique_id: demonx_feed_display
        icon: mdi:speedometer
        state: >-
          {{ states('sensor.cnc_feed_rate') | int(0) }} mm/min

      - name: "DemonX Spindle Display"
        unique_id: demonx_spindle_display
        icon: mdi:rotate-3d-variant
        state: >-
          {{ states('sensor.cnc_spindle_rpm') | int(0) }} RPM

  - binary_sensor:
      - name: "CNC Running"
        unique_id: demonx_cnc_running
        state: >
          {{ states('sensor.cnc_state') in ['Run', 'Jog'] }}
        icon: mdi:play-circle
        device_class: running

      - name: "CNC Alarm"
        unique_id: demonx_cnc_alarm
        state: >
          {{ states('sensor.cnc_state') == 'Alarm' }}
        icon: mdi:alert-circle
        device_class: problem

      - name: "CNC Homing"
        unique_id: demonx_cnc_homing
        state: >
          {{ states('sensor.cnc_state') == 'Home' }}
        icon: mdi:home-search

      - name: "CNC Idle"
        unique_id: demonx_cnc_idle
        state: >
          {{ states('sensor.cnc_state') == 'Idle' }}
        icon: mdi:check-circle

      - name: "DemonX Connected"
        unique_id: demonx_connected
        device_class: connectivity
        state: >-
          {{ states('sensor.cnc_state') not in
             ['unknown', 'unavailable', 'none', ''] }}


# ─────────────────────────────────────────────────────────────────────────────
# REST Commands — POST to DemonX server, forwarded to FluidNC
# ─────────────────────────────────────────────────────────────────────────────
rest_command:
  cnc_feed_hold:
    url: http://10.10.1.31:8080/api/command
    method: POST
    content_type: "application/json"
    payload: '{"cmd":"!"}'

  cnc_resume:
    url: http://10.10.1.31:8080/api/command
    method: POST
    content_type: "application/json"
    payload: '{"cmd":"~"}'

  cnc_soft_reset:
    url: http://10.10.1.31:8080/api/command
    method: POST
    content_type: "application/json"
    payload: '{"cmd":"\u0018"}'

  cnc_unlock:
    url: http://10.10.1.31:8080/api/command
    method: POST
    content_type: "application/json"
    payload: '{"cmd":"$X\n"}'

  cnc_home_all:
    url: http://10.10.1.31:8080/api/command
    method: POST
    content_type: "application/json"
    payload: '{"cmd":"$H\n"}'


# ─────────────────────────────────────────────────────────────────────────────
# Button Entities
# ─────────────────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "CNC Feed Hold"
    unique_id: demonx_btn_hold
    icon: mdi:pause-circle
    on_press:
      - service: rest_command.cnc_feed_hold

  - platform: template
    name: "CNC Resume"
    unique_id: demonx_btn_resume
    icon: mdi:play-circle
    on_press:
      - service: rest_command.cnc_resume

  - platform: template
    name: "CNC Soft Reset"
    unique_id: demonx_btn_reset
    icon: mdi:restart
    on_press:
      - service: rest_command.cnc_soft_reset

  - platform: template
    name: "CNC Unlock"
    unique_id: demonx_btn_unlock
    icon: mdi:lock-open-variant
    on_press:
      - service: rest_command.cnc_unlock

  - platform: template
    name: "CNC Home All"
    unique_id: demonx_btn_home
    icon: mdi:home-export-outline
    on_press:
      - service: rest_command.cnc_home_all


# ─────────────────────────────────────────────────────────────────────────────
# Automations
# ─────────────────────────────────────────────────────────────────────────────
automation:

  - id: demonx_run_tts
    alias: "DemonX - Job Started TTS"
    trigger:
      - trigger: state
        entity_id: sensor.cnc_state
        from: "Idle"
        to: "Run"
    action:
      - action: media_player.volume_set
        target:
          entity_id: media_player.garage_desk_sonos
        data:
          volume_level: 0.6
      - action: tts.speak
        target:
          entity_id: tts.google_en_com
        data:
          media_player_entity_id: media_player.garage_desk_sonos
          message: "DemonX is now running."
    mode: single

  - id: demonx_idle_tts
    alias: "DemonX - Job Complete TTS"
    trigger:
      - trigger: state
        entity_id: sensor.cnc_state
        from: "Run"
        to: "Idle"
        for: "00:00:03"
    action:
      - action: media_player.volume_set
        target:
          entity_id: media_player.garage_desk_sonos
        data:
          volume_level: 0.6
      - action: tts.speak
        target:
          entity_id: tts.google_en_com
        data:
          media_player_entity_id: media_player.garage_desk_sonos
          message: "DemonX job complete. Machine is idle."
    mode: single

  - id: demonx_alarm_tts
    alias: "DemonX - Alarm TTS"
    trigger:
      - trigger: state
        entity_id: sensor.cnc_state
        to: "Alarm"
    action:
      - action: media_player.volume_set
        target:
          entity_id: media_player.garage_desk_sonos
        data:
          volume_level: 0.9
      - action: tts.speak
        target:
          entity_id: tts.google_en_com
        data:
          media_player_entity_id: media_player.garage_desk_sonos
          message: "Warning. DemonX alarm condition. Check the machine immediately."
    mode: single

  - id: demonx_hold_tts
    alias: "DemonX - Feed Hold TTS"
    trigger:
      - trigger: state
        entity_id: sensor.cnc_state
        to: "Hold"
    action:
      - action: tts.speak
        target:
          entity_id: tts.google_en_com
        data:
          media_player_entity_id: media_player.garage_desk_sonos
          message: "DemonX feed hold engaged."
    mode: single

  - id: demonx_camera_push
    alias: "DemonX - Push Shop Camera on Run"
    trigger:
      - trigger: state
        entity_id: sensor.cnc_state
        to: "Run"
    action:
      - action: camera.play_stream
        target:
          entity_id: camera.cnc_reolink
        data:
          media_player: media_player.dads_streaming_stick_4k_2
          format: hls
    mode: restart

  - id: demonx_alarm_notify
    alias: "DemonX - Alarm Persistent Notification"
    trigger:
      - trigger: state
        entity_id: sensor.cnc_state
        to: "Alarm"
    action:
      - action: persistent_notification.create
        data:
          title: "🔴 DemonX ALARM"
          message: >
            Alarm triggered at {{ now().strftime('%H:%M:%S') }}.
            X: {{ states('sensor.cnc_x_position') }} mm |
            Y: {{ states('sensor.cnc_y_position') }} mm |
            Z: {{ states('sensor.cnc_z_position') }} mm
          notification_id: demonx_alarm
    mode: single

  - id: demonx_alarm_clear_notify
    alias: "DemonX - Clear Alarm Notification on Unlock"
    trigger:
      - trigger: state
        entity_id: sensor.cnc_state
        from: "Alarm"
    action:
      - action: persistent_notification.dismiss
        data:
          notification_id: demonx_alarm
    mode: single


# ─────────────────────────────────────────────────────────────────────────────
# Job Tracking Sensors (file name, progress, rows, timing)
# ─────────────────────────────────────────────────────────────────────────────
# These are added to the same REST resource above — shown separately for clarity
# Add these sensor entries inside the rest: block above, or use a second rest block:

rest:
  - resource: http://10.10.1.31:8080/api/status
    scan_interval: 2
    timeout: 3

    sensor:
      - name: "CNC Job File"
        unique_id: demonx_job_file
        value_template: "{{ value_json.job.file or 'None' }}"
        icon: mdi:file-cog-outline

      - name: "CNC Job Progress"
        unique_id: demonx_job_progress
        value_template: "{{ value_json.job.progress | int(0) }}"
        unit_of_measurement: "%"
        icon: mdi:progress-check
        state_class: measurement

      - name: "CNC Job Total Lines"
        unique_id: demonx_job_total
        value_template: "{{ value_json.job.totalLines | int(0) }}"
        icon: mdi:format-list-numbered
        state_class: measurement

      - name: "CNC Job Sent Lines"
        unique_id: demonx_job_sent
        value_template: "{{ value_json.job.sentLines | int(0) }}"
        icon: mdi:check-all
        state_class: measurement

      - name: "CNC Job Remaining Lines"
        unique_id: demonx_job_remaining
        value_template: "{{ value_json.job.remainingLines | int(0) }}"
        icon: mdi:dots-horizontal
        state_class: measurement

      - name: "CNC Elapsed Time"
        unique_id: demonx_job_elapsed
        value_template: "{{ value_json.job.elapsed }}"
        icon: mdi:timer-outline

      - name: "CNC Remaining Time"
        unique_id: demonx_job_remaining_time
        value_template: "{{ value_json.job.remaining }}"
        icon: mdi:timer-sand

    binary_sensor:
      - name: "CNC Job Running"
        unique_id: demonx_job_running
        value_template: "{{ value_json.job.running }}"
        device_class: running


