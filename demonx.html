// ── THEME ──────────────────────────────────────────────────────────────────
const THEMES = {
  dark:  { bg:'#0c0c18', surface:'#111122', border:'#1e2a3a', text:'#c8d4e4', muted:'#4a5a6a', topbar:'#07070e' },
  light: { bg:'#e8edf4', surface:'#ffffff', border:'#c0cdd8', text:'#1a2535', muted:'#7a8a9a', topbar:'#d0dae8' },
};
let currentTheme = localStorage.getItem('demonx_theme')||'dark';
let C = {...THEMES[currentTheme]};
function applyTheme(t){
  currentTheme=t;
  Object.assign(C,THEMES[t]);
  localStorage.setItem('demonx_theme',t);
  document.body.classList.toggle('pgc-dark', t==='dark');
  document.body.classList.toggle('pgc-light', t==='light');
}

const LS = { panels:'demonx_panels_v6', settings:'demonx_settings_v3', al:'demonx_al_v2', cam:'demonx_cam_v1' };

  { id:'visualizer',title:'🗺  VISUALIZER', accent:'#818cf8', x:845, y:48,  w:420, h:480 },
  { id:'config',    title:'⚙  CONFIG',      accent:'#94a3b8', x:845, y:540, w:420, h:320 },

// ── APP STATE ──────────────────────────────────────────────────────────────
const app = {
  connected:false, baud:115200,
  grbl:{ state:'Disconnected', MPos:[0,0,0], WCO:[0,0,0], FS:[0,0] },

    {k:'sys',m:'DemonX  ·  Web Serial CNC Controller'},

// Restore cam settings
(()=>{ try{ const s=JSON.parse(localStorage.getItem(LS.cam)||'{}');
  if(s.url) app.camRtspUrl=s.url;
  if(s.user) app.camRtspUser=s.user;
  if(s.pass) app.camRtspPass=s.pass;
  if(s.path) app._reolinkPath=s.path;
}catch(_){} })();

// ── TRANSPORT DETECTION ────────────────────────────────────────────────────
(async function detectTransport(){
  try {
    const r=await fetch('/api/ports',{signal:AbortSignal.timeout(700)});
    if(r.ok){
      app.transport='websocket';
      const ports=await r.json();
      app.availablePorts=ports;
      // Auto-select last used port
      const lastPort=localStorage.getItem('demonx_lastport');
      const match=ports.find(p=>p.path===lastPort);
      app.selectedPort=(match||ports[0]||{}).path||'';
      addLog('Server mode  ·  WebSocket transport','sys');
      addLog(`${ports.length} serial port(s) available`,'sys');
      render();
      // Auto-connect if we have a last port and not already connected
      if(app.selectedPort&&!app.connected){
        addLog(`Auto-connecting to ${app.selectedPort}…`,'sys');
        setTimeout(()=>connect(),400);
      }
      return;
    }
  } catch(_){}
  app.transport=('serial' in navigator)?'webserial':'none';
  if(app.transport==='webserial') addLog('Local mode  ·  Web Serial transport','sys');
  else addLog('No transport  ·  open in Chrome or run server.js','err');
  render();
})();
loadAL();

// ── STORAGE ────────────────────────────────────────────────────────────────
function loadPref(key, def) {
  try { return {...def, ...JSON.parse(localStorage.getItem(key)||'{}')}; }
  catch(_) { return {...def}; }
}
function savePref(key, obj) { localStorage.setItem(key, JSON.stringify(obj)); }

function restorePanels(defs) {
  const saved = loadPref(LS.panels, {});
  return defs.map(d => {
    const s = saved[d.id];
    return s ? {...d, x:s.x, y:s.y, w:s.w, h:s.h} : {...d};
  });
}
function savePanels() {
  const obj = {};
  app.panels.forEach(p => { obj[p.id]={x:p.x,y:p.y,w:p.w,h:p.h}; });
  savePref(LS.panels, obj);
}

function saveSettings() { savePref(LS.settings, app.settings); }

function saveAL() {
  savePref(LS.al, {
    enabled:app.autolevel.enabled, measured:app.autolevel.measured,
    gridCols:app.autolevel.gridCols, gridRows:app.autolevel.gridRows,
    minX:app.autolevel.minX, maxX:app.autolevel.maxX,
    minY:app.autolevel.minY, maxY:app.autolevel.maxY,
    scanOffsetX:app.autolevel.scanOffsetX, scanOffsetY:app.autolevel.scanOffsetY,
    grid:app.autolevel.grid,
  });
}
function loadAL() {
  const s = loadPref(LS.al, {});
  if(s.grid && s.grid.length) Object.assign(app.autolevel, s);
}

// ── DOM HELPER ─────────────────────────────────────────────────────────────
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})) {
    if(k==='style') Object.assign(e.style, v);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='disabled') { if(v) e.disabled=true; }  // only set if truly disabled
    else e.setAttribute(k,v);
  }
  for(const k of kids.flat()) {
    if(k==null) continue;
    e.appendChild(typeof k==='string'?document.createTextNode(k):k);
  }
  return e;
}

// ── COMPONENTS ─────────────────────────────────────────────────────────────
function mkBtn(label, onClick, color='#3b82f6', opts={}) {
  const {small,disabled,full} = opts;
  return h('button',{
    disabled:!!disabled,
    style:{background:disabled?'transparent':`${color}15`,
      border:`1px solid ${disabled?C.border:color+'40'}`,
      color:disabled?C.muted:color,
      borderRadius:'5px',padding:small?'4px 10px':'7px 14px',
      fontSize:small?'11px':'12px',fontWeight:'700',
      cursor:disabled?'not-allowed':'pointer',
      letterSpacing:'0.05em',width:full?'100%':undefined},
    onClick:disabled?null:e=>{e.stopPropagation();onClick();},
  },label);
}

function mkNum(val, onChange, width='58px', step='0.01') {
  const stepVal = parseFloat(step) || 0.01;
  // Use 0.5 for whole-number fields, stepVal for decimal fields
  const bigStep = stepVal >= 1 ? 1 : 0.5;

  const wrap = h('div',{style:{display:'flex',alignItems:'center',gap:'0',
    border:`1px solid ${C.border}`,borderRadius:'5px',overflow:'hidden',flexShrink:'0'}});

  const btnStyle = (side) => ({
    background:C.bg, color:C.muted, border:'none',
    borderRight: side==='left' ? `1px solid ${C.border}` : 'none',
    borderLeft:  side==='right'? `1px solid ${C.border}` : 'none',
    padding:'4px 7px', fontSize:'13px', cursor:'pointer',
    fontFamily:'inherit', lineHeight:'1', flexShrink:'0',
    minWidth:'26px', textAlign:'center',
  });

  const inp = h('input',{type:'number', value:val, step:stepVal,
    style:{background:C.bg, color:C.text, border:'none', outline:'none',
      padding:'4px 4px', fontSize:'11px', width, textAlign:'center',
      fontFamily:'inherit',
      // Hide native spinners
      MozAppearance:'textfield'},
    onChange: e => onChange(parseFloat(e.target.value)||0)});
  // Chrome/Safari spinner hide via CSS class added below
  inp.style.cssText += ';-webkit-appearance:none;-moz-appearance:textfield;';

  const minus = h('button',{style:btnStyle('left')},  '−');
  const plus  = h('button',{style:btnStyle('right')}, '+');

  function step_(dir){
    const cur = parseFloat(inp.value)||0;
    const next = parseFloat((cur + dir*bigStep).toFixed(6));
    inp.value = next;
    onChange(next);
  }

  // Tap
  minus.addEventListener('click', ()=>step_(-1));
  plus.addEventListener('click',  ()=>step_(1));

  // Hold-to-repeat
  let holdTimer, holdInterval;
  function startHold(dir){
    holdTimer = setTimeout(()=>{
      holdInterval = setInterval(()=>step_(dir), 80);
    }, 400);
  }
  function endHold(){
    clearTimeout(holdTimer); clearInterval(holdInterval);
  }
  [minus,plus].forEach((btn,i)=>{
    const dir = i===0 ? -1 : 1;
    btn.addEventListener('mousedown', ()=>startHold(dir));
    btn.addEventListener('touchstart', e=>{e.preventDefault();step_(dir);startHold(dir);},{passive:false});
    ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>btn.addEventListener(ev,endHold));
  });

  wrap.appendChild(minus);
  wrap.appendChild(inp);
  wrap.appendChild(plus);
  return wrap;
}

function mkRow(label, widget, unit='') {
  const r=h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'5px'}});
  r.appendChild(h('span',{style:{fontSize:'10px',color:C.muted,flex:'1',minWidth:'0'}},label));
  r.appendChild(widget);
  if(unit) r.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},unit));
  return r;
}

function coordRow(label, vals, accent, ids) {
  const r=h('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'8px'}});
  r.appendChild(h('span',{style:{fontSize:'10px',fontWeight:'700',color:C.muted,width:'44px',flexShrink:'0'}},label));
  ['X','Y','Z'].forEach((a,i)=>{
    const c=h('div',{style:{flex:'1',background:C.bg,borderRadius:'5px',padding:'4px 6px',textAlign:'center'}});
    c.appendChild(h('div',{style:{fontSize:'9px',color:C.muted,marginBottom:'1px'}},a));
    const val=h('div',{style:{fontSize:'14px',fontWeight:'700',color:accent,fontVariantNumeric:'tabular-nums'}},
      (vals[i]||0).toFixed(3));
    if(ids) val.id=ids[i];
    c.appendChild(val);
    r.appendChild(c);
  });
  return r;
}

function sep() { return h('div',{style:{height:'1px',background:C.border,margin:'8px 0'}}); }

// ── NOTIFICATIONS ──────────────────────────────────────────────────────────
function addLog(m,k='rx') { app.log=[...app.log.slice(-500),{k,m}]; }
function notify(msg,color='#22c55e') {
  clearTimeout(app.notifyTimer);
  app.notification={msg,color};
  app.notifyTimer=setTimeout(()=>{app.notification=null;render();},5000);
  render();
}

// ── SERIAL I/O (transport-aware) ────────────────────────────────────────────
async function write(data,noNl=false){
  const bytes=noNl?data:data+'\n';
  if(app.transport==='webserial'&&app.writer){
    await app.writer.write(new TextEncoder().encode(bytes));
  } else if(app.transport==='websocket'&&app.wsConn?.readyState===1){
    app.wsConn.send(JSON.stringify({cmd:'write',data:bytes}));
  }
}

// ── PIN / SWITCH MONITORING ──────────────────────────────────────────────────
const PIN_NAMES = { X:'X Limit', Y:'Y Limit', Z:'Z Limit', A:'A Limit', P:'Probe', D:'Door', R:'Reset', S:'Feed Hold', F:'Cycle Start' };
let pinPopupTimer=null;

function checkPinChanges(prev, curr){
  if(!curr&&!prev) return;
  // Auto-dismiss limit popups when pins clear during homing
  if(prev&&!curr&&app.homing){
    const existing=document.getElementById('pin-popup');
    if(existing) existing.remove();
    return;
  }
  if(!curr||curr===prev) return;
  const newPins=[...curr].filter(c=>!prev.includes(c));
  if(!newPins.length) return;
  const names=newPins.map(c=>PIN_NAMES[c]||c).join(', ');
  showPinPopup(names, newPins.includes('P'), app.homing);
}

function showPinPopup(names, isProbe, isHoming=false){
  // Clear any existing pin popup
  clearTimeout(pinPopupTimer);
  const existing=document.getElementById('pin-popup');
  if(existing) existing.remove();

  const popup=document.createElement('div');
  popup.id='pin-popup';
  // Color logic: probe=green, homing limit=teal, unexpected limit=red
  const color = isProbe ? '#22c55e' : isHoming ? '#06b6d4' : '#ef4444';
  const bgColor = isProbe ? 'rgba(15,30,15,0.97)' : isHoming ? 'rgba(5,25,35,0.97)' : 'rgba(35,8,8,0.97)';
  const icon = isProbe ? '🔵' : isHoming ? '🏠' : '🔴';
  const title = isProbe ? 'PROBE TRIGGERED' : isHoming ? 'HOMING — LIMIT HIT' : 'SWITCH TRIGGERED';
  popup.style.cssText=`
    position:fixed; top:60px; left:50%; transform:translateX(-50%);
    z-index:99999; min-width:280px; max-width:400px;
    background:${bgColor};
    border:2px solid ${color};
    border-radius:10px; padding:14px 20px;
    box-shadow:0 0 40px ${color}66;
    font-family:inherit; text-align:center;
    animation:pinpopup 0.15s ease-out;
  `;
  popup.innerHTML=`
    <div style="font-size:22px;margin-bottom:4px">${icon}</div>
    <div style="font-size:13px;font-weight:700;color:${color};letter-spacing:0.08em;margin-bottom:4px">
      ${title}
    </div>
    <div style="font-size:12px;color:#c8d4e4;opacity:0.9">${names}</div>
    <div style="font-size:10px;color:#64748b;margin-top:6px">${isHoming?'Auto-dismisses when clear':'Click to dismiss'}</div>
  `;
  popup.addEventListener('click',()=>popup.remove());

  // Add CSS animation if not already there
  if(!document.getElementById('pin-popup-style')){
    const st=document.createElement('style');
    st.id='pin-popup-style';
    st.textContent=`@keyframes pinpopup{from{opacity:0;transform:translateX(-50%) scale(0.9)}to{opacity:1;transform:translateX(-50%) scale(1)}}`;
    document.head.appendChild(st);
  }
  document.body.appendChild(popup);
  // Auto-dismiss: probes after 8s, homing popups after 4s, limit errors stay
  if(isProbe) pinPopupTimer=setTimeout(()=>popup.remove(), 8000);
  else if(isHoming) pinPopupTimer=setTimeout(()=>popup.remove(), 4000);
}

// ── PROBE WORKFLOW HELPERS ───────────────────────────────────────────────────
function waitForOk(ms=12000) {
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>{
      const i=app.okQueue.indexOf(cb); if(i>=0) app.okQueue.splice(i,1);
      rej(new Error('ok timeout'));
    },ms);
    const cb=()=>{clearTimeout(t);res();};
    app.okQueue.push(cb);
  });
}
function releaseOk() { if(app.okQueue.length>0) app.okQueue.shift()(); }

// ── PRB CAPTURE ────────────────────────────────────────────────────────────
function parsePRB(line) {
  const m=line.match(/\[PRB:([^:]+):([01])\]/);
  if(!m) return null;
  const [x,y,z]=m[1].split(',').map(Number);
  return {x,y,z,ok:m[2]==='1'};
}
function waitForPRB(ms=20000) {
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>{app.prbResolve=null;rej(new Error('PRB timeout'));},ms);
    app.prbResolve=(prb)=>{clearTimeout(t);res(prb);};
  });
}

// ── GRBL STATUS ─────────────────────────────────────────────────────────────
function parseStatus(raw) {
  if(!raw.startsWith('<')) return null;
  const parts=raw.slice(1,raw.indexOf('>')).split('|');
  const out={state:parts[0]};
  for(let i=1;i<parts.length;i++){
    const ci=parts[i].indexOf(':'); if(ci<0) continue;
    const key=parts[i].slice(0,ci);
    const val=parts[i].slice(ci+1);
    // Pn is a string of active pin chars e.g. "XYP", not numbers
    if(key==='Pn') out.Pn=val;
    else out[key]=val.split(',').map(Number);
  }
  return out;
}

// ── CONNECT / DISCONNECT ────────────────────────────────────────────────────
async function connect() {
  if(app.transport==='websocket') return connectWS();
  if(app.transport==='webserial') return connectSerial();
  addLog('No transport available','err'); render();
}

async function connectWS(){
  if(app.wsConn&&app.wsConn.readyState<2) return; // already open or connecting
  const wsUrl=`ws://${location.host}/ws/serial`;
  addLog(`Connecting WS → ${wsUrl}`,'sys');
  const ws=new WebSocket(wsUrl);
  app.wsConn=ws;
  ws.onopen=()=>{
    // Always send connect — server will confirm if already open, or open if not
    // Server guards against tearing down an existing connection for same port/baud
    if(app.selectedPort){
      ws.send(JSON.stringify({cmd:'connect',port:app.selectedPort,baud:app.baud}));
    } else {
      // No port selected yet — just request port list, wait for user to connect
      ws.send(JSON.stringify({cmd:'list'}));
    }
  };
  ws.onmessage=e=>{
    let msg; try{msg=JSON.parse(e.data);}catch(_){return;}
    if(msg.type==='connected'){
      app.connected=true; app.okQueue=[];
      addLog(`Connected to ${msg.port} @ ${app.baud} baud`,'sys');
      localStorage.setItem('demonx_lastport', msg.port);
      // Server handles ? polling — no client-side poll needed in WS mode
      render();
      setTimeout(()=>write('$I'),600);
    } else if(msg.type==='data'){
      handleLine(msg.line);
    } else if(msg.type==='disconnected'){
      clearInterval(app.poll); app.okQueue=[]; app.prbResolve=null;
      app.connected=false; app.grbl.state='Disconnected';
      addLog('Disconnected','sys'); render();
    } else if(msg.type==='error'){
      addLog('WS error: '+msg.msg,'err'); render();
    } else if(msg.type==='ports'){
      app.availablePorts=msg.ports;
      if(msg.ports.length&&!app.selectedPort) app.selectedPort=msg.ports[0].path;
      render();
    } else if(msg.type==='clients'){
      app.wsClientCount=msg.count; render();
    }
  };
  ws.onclose=()=>{
    clearInterval(app.poll); app.okQueue=[]; app.prbResolve=null;
    app.connected=false; app.grbl.state='Disconnected';
    addLog('Connection to server lost — serial may still be running','sys'); render();
  };
  ws.onerror=()=>{ addLog('WS connection error','err'); render(); };
}

async function connectSerial() {
  if(!('serial' in navigator)){addLog('Web Serial unavailable','err');render();return;}
  try {
    const port=await navigator.serial.requestPort();
    await port.open({baudRate:app.baud});
    app.port=port; app.writer=port.writable.getWriter();
    app.connected=true; app.okQueue=[];
    addLog(`Connected @ ${app.baud} baud`,'sys'); render();
    app.poll=setInterval(()=>{if(app.writer) write('?',true);},250);
    (async()=>{
      const dec=new TextDecoder(); let buf='';
      try {
        const reader=port.readable.getReader();
        while(true){
          const {value,done}=await reader.read(); if(done) break;
          buf+=dec.decode(value,{stream:true});
          let nl;
          while((nl=buf.indexOf('\n'))!==-1){
            const line=buf.slice(0,nl).trimEnd(); buf=buf.slice(nl+1);
            if(line) handleLine(line);
          }
        }
      } catch(e){if(e.name!=='AbortError'){addLog('Read error: '+e.message,'err');render();}}
      clearInterval(app.poll); app.okQueue=[]; app.prbResolve=null;
      app.connected=false; app.grbl.state='Disconnected';
      app.writer=null; app.port=null;
      addLog('Disconnected','sys'); render();
    })();
    setTimeout(()=>write('$I'),600);
  } catch(e){if(e.name!=='NotFoundError'){addLog('Connect error: '+e.message,'err');render();}}
}

async function disconnect() {
  clearInterval(app.poll); app.okQueue=[]; app.prbResolve=null;
  if(app.transport==='websocket'){
    if(app.wsConn){
      try{app.wsConn.send(JSON.stringify({cmd:'disconnect'}));}catch(_){}
      app.wsConn.close(); app.wsConn=null;
    }
  } else {
    try{await app.writer?.releaseLock?.();}catch(_){}
    try{await app.port?.close?.();}catch(_){}
    app.writer=null; app.port=null;
  }
  app.connected=false; app.grbl.state='Disconnected';
  addLog('Disconnected','sys'); render();
}

// ── CENTRALISED LINE HANDLER ────────────────────────────────────────────────
function handleLine(line){
  if(!line) return;
  if(line.startsWith('<')){
    const s=parseStatus(line);
    if(s){
      // Detect pin state changes for switch trigger popups
      const prevPn=app.grbl.Pn||'';
      const newPn=s.Pn||'';
      const prevState=app.grbl.state;
      app.grbl={...app.grbl,...s};
      // Clear homing flag when machine leaves Home state
      if(prevState==='Home'&&s.state!=='Home') app.homing=false;
      checkPinChanges(prevPn, newPn);
      renderLive();
    }
  } else if(line==='ok'){
    releaseOk();
    // If we were loading config, ok signals end of $$ dump
    if(app.cfgLoading){ app.cfgLoading=false; render(); }
  } else if(line.startsWith('$')&&line.includes('=')&&app.cfgLoading){
    // Parse $key=value lines from $$ response
    const eq=line.indexOf('=');
    const key=line.slice(1,eq).trim();
    const rest=line.slice(eq+1);
    // Value is before any space/comment
    const val=rest.split(/[\s\/]/)[0].trim();
    const comment=rest.includes('/')?rest.slice(rest.indexOf('/')+1).trim():'';
    app.cfgSettings[key]={val, comment};
  } else if(line.startsWith('error:')){
    addLog(line,'err'); releaseOk(); notify('⚠ '+line,'#ef4444'); render();
  } else if(line.startsWith('ALARM:')){
    addLog(line,'err'); releaseOk(); notify('🚨 ALARM: '+line,'#ef4444'); render();
  } else if(line.startsWith('[PRB:')){
    addLog(line,'rx');
    const prb=parsePRB(line);
    if(prb&&app.prbResolve){const r=app.prbResolve;app.prbResolve=null;r(prb);}
    else if(prb) notify('✓ Probe: '+line,'#22c55e');
    renderLog();
  } else {
    addLog(line,'rx'); renderLog();
  }
}

// ── FILE OPERATIONS ─────────────────────────────────────────────────────────
// ── JOB TIME ESTIMATOR ────────────────────────────────────────────────────
function estimateJobTime(lines){
  let t=0, x=0, y=0, z=0, f=1000, rapid=3000;
  let isAbs=true;
  for(const raw of lines){
    const l=raw.toUpperCase().replace(/\s+/g,'');
    if(!l||l.startsWith(';')||l.startsWith('(')) continue;
    if(l.includes('G90')) isAbs=true;
    if(l.includes('G91')) isAbs=false;
    const fMatch=l.match(/F([\d.]+)/); if(fMatch) f=parseFloat(fMatch[1]);
    const getVal=(ax,cur)=>{const m=l.match(new RegExp(ax+'([\\-\\d.]+)')); return m?parseFloat(m[1]):cur;};
    const nx=getVal('X',isAbs?x:0), ny=getVal('Y',isAbs?y:0), nz=getVal('Z',isAbs?z:0);
    const dx=isAbs?nx-x:nx, dy=isAbs?ny-y:ny, dz=isAbs?nz-z:nz;
    const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(dist>0){
      const isRapid=l.startsWith('G0');
      t+=dist/(isRapid?rapid:f)*60;
    }
    if(isAbs){x=nx;y=ny;z=nz;} else{x+=nx;y+=ny;z+=nz;}
  }
  const h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=Math.floor(t%60);
  return t<1?null: h>0?`${h}h ${m}m ${s}s`:`${m}m ${s}s`;
}


function loadFile(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const lines=ev.target.result.split('\n').map(l=>{
      const si=l.indexOf(';'); return (si>=0?l.slice(0,si):l).replace(/\(.*?\)/g,'').trim();
    }).filter(l=>l&&l!=='%');
    app.glines=lines; app.gfile=f.name; app.progress=0;
    app.jobTimeEst=estimateJobTime(lines);
    app.vizPaths=parseGcodePaths(lines);
    app.vizZoom=1; app.vizPanX=0; app.vizPanY=0; app.vizFitted=false;
    addLog(`Loaded: ${f.name}  (${lines.length} lines)`,'sys'); render();
  };
  r.readAsText(f); e.target.value='';
}

// G-code processor — applies autolevel Z correction in real-time
class GcodeProcessor {
  constructor(){ this.cx=0;this.cy=0;this.cz=0;this.abs=true; }
  process(line){
    const up=line.toUpperCase();
    if(/G91/.test(up)) this.abs=false;
    if(/G90/.test(up)) this.abs=true;
    const xm=line.match(/[Xx](-?\d+\.?\d*(?:[eE][+-]?\d+)?)/);
    const ym=line.match(/[Yy](-?\d+\.?\d*(?:[eE][+-]?\d+)?)/);
    const zm=line.match(/[Zz](-?\d+\.?\d*(?:[eE][+-]?\d+)?)/);
    const nx=xm?parseFloat(xm[1]):null;
    const ny=ym?parseFloat(ym[1]):null;
    const nz=zm?parseFloat(zm[1]):null;
    if(nx!==null) this.cx=this.abs?nx:this.cx+nx;
    if(ny!==null) this.cy=this.abs?ny:this.cy+ny;
    if(!app.autolevel.enabled||!app.autolevel.measured){
      if(nz!==null) this.cz=this.abs?nz:this.cz+nz;
      return line;
    }
    // Only correct G1 cutting moves with Z
    if(!up.match(/G0*1\b/)||nz===null){
      if(nz!==null) this.cz=this.abs?nz:this.cz+nz;
      return line;
    }
    const zWork=this.abs?nz:this.cz+nz;
    const correction=getZCorrection(this.cx,this.cy);
    const zCorr=(zWork+correction).toFixed(4);
    this.cz=zWork;
    return line.replace(/[Zz]-?\d+\.?\d*(?:[eE][+-]?\d+)?/i,'Z'+zCorr);
  }
}

async function sendLine(cmd){
  await write(cmd); addLog(cmd,'tx');
  try{await waitForOk(15000);}catch(e){throw e;}
}

function broadcastJob(running){
  if(app.transport==='websocket'&&app.wsConn?.readyState===1){
    app.wsConn.send(JSON.stringify({
      cmd:'jobUpdate',
      file: app.gfile,
      totalLines: app.glines.length,
      sentLines:  app.progress ? Math.round(app.progress/100*app.glines.length) : 0,
      progress:   app.progress,
      running,
    }));
  }
}

async function runFile(){
  if(!app.glines.length||!app.connected||app.sending) return;
  app.sending=true; app.stopSend=false; app.okQueue=[]; render();
  broadcastJob(true);
  const proc=new GcodeProcessor();
  if(app.autolevel.enabled&&app.autolevel.measured)
    addLog(`▶ Running with autolevel: ${app.gfile}`,'sys');
  else addLog(`▶ Running: ${app.gfile}`,'sys');
  for(let i=0;i<app.glines.length;i++){
    if(app.stopSend){addLog('Stopped.','err');break;}
    const line=proc.process(app.glines[i]);
    await write(line);
    try{await waitForOk(15000);}
    catch(ex){addLog(`Line ${i+1}: ${ex.message} — stopping`,'err');app.stopSend=true;break;}
    app.progress=Math.round(((i+1)/app.glines.length)*100);
    if(i%8===0){ render(); broadcastJob(true); }
  }
  app.sending=false; app.okQueue=[];
  broadcastJob(false);
  if(!app.stopSend){addLog('✓ Complete','sys');notify('✓ Job complete!');}
  render();
}

function stopFile(){
  app.stopSend=true; app.sending=false; app.okQueue=[];
  broadcastJob(false);
  write('\x18',true); write('!',true);
  addLog('⚠ Stop + Reset','err'); render();
}

// ── FRAME JOB ───────────────────────────────────────────────────────────────
function parseExtents(lines){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  let abs=true,cx=0,cy=0;
  for(const line of lines){
    const u=line.toUpperCase().replace(/\s/g,'');
    if(/G91/.test(u)) abs=false; if(/G90/.test(u)) abs=true;
    const xm=u.match(/X(-?\d+\.?\d*)/),ym=u.match(/Y(-?\d+\.?\d*)/);
    if(xm){cx=abs?parseFloat(xm[1]):cx+parseFloat(xm[1]);minX=Math.min(minX,cx);maxX=Math.max(maxX,cx);}
    if(ym){cy=abs?parseFloat(ym[1]):cy+parseFloat(ym[1]);minY=Math.min(minY,cy);maxY=Math.max(maxY,cy);}
  }
  return{minX,maxX,minY,maxY};
}

async function frameJob(){
  if(!app.glines.length||!app.connected) return;
  const{minX,maxX,minY,maxY}=parseExtents(app.glines);
  if(!isFinite(minX)){addLog('No XY coords in file','err');render();return;}
  const z=app.settings.safeZ;
  addLog(`Frame: X[${minX.toFixed(2)}→${maxX.toFixed(2)}] Y[${minY.toFixed(2)}→${maxY.toFixed(2)}]`,'sys');
  app.okQueue=[];
  for(const cmd of[`G90`,`G0 Z${z.toFixed(3)}`,
    `G0 X${minX.toFixed(3)} Y${minY.toFixed(3)}`,`G0 X${maxX.toFixed(3)} Y${minY.toFixed(3)}`,
    `G0 X${maxX.toFixed(3)} Y${maxY.toFixed(3)}`,`G0 X${minX.toFixed(3)} Y${maxY.toFixed(3)}`,
    `G0 X${minX.toFixed(3)} Y${minY.toFixed(3)}`]){
    await write(cmd); addLog(cmd,'tx');
    try{await waitForOk(12000);}catch(_){break;}
    render();
  }
  addLog('Frame done','sys'); notify('Frame complete'); render();
}

// ── AUTOLEVEL ───────────────────────────────────────────────────────────────
function getZCorrection(wx,wy){
  const al=app.autolevel;
  if(!al.measured||!al.enabled||!al.grid.length) return 0;
  const{gridCols:gc,gridRows:gr,minX,maxX,minY,maxY,grid}=al;
  const nx=Math.max(0,Math.min(gc-1,(wx-minX)/(maxX-minX)*(gc-1)));
  const ny=Math.max(0,Math.min(gr-1,(wy-minY)/(maxY-minY)*(gr-1)));
  const x0=Math.floor(nx),x1=Math.min(x0+1,gc-1);
  const y0=Math.floor(ny),y1=Math.min(y0+1,gr-1);
  const fx=nx-x0,fy=ny-y0;
  const z00=grid[y0]?.[x0]??0,z10=grid[y0]?.[x1]??0;
  const z01=grid[y1]?.[x0]??0,z11=grid[y1]?.[x1]??0;
  return (1-fx)*(1-fy)*z00+fx*(1-fy)*z10+(1-fx)*fy*z01+fx*fy*z11;
}

async function startAutolevel(){
  if(!app.connected) return;
  const al=app.autolevel;
  const{gridCols:gc,gridRows:gr,minX:rawMinX,maxX:rawMaxX,minY:rawMinY,maxY:rawMaxY,
        scanOffsetX:offX,scanOffsetY:offY,probeDepth,probeFeed,safeZAL}=al;
  // Apply border offset — shrink boundary inward on all four sides
  const minX=rawMinX+(offX||0), maxX=rawMaxX-(offX||0);
  const minY=rawMinY+(offY||0), maxY=rawMaxY-(offY||0);
  if(minX>=maxX||minY>=maxY){
    addLog('⚠ Scan offset too large — no scan area remaining','err');
    notify('⚠ Offset too large','#ef4444'); return;
  }
  const offsetNote=(offX||offY)?`\nBorder offset: ${offX}mm X / ${offY}mm Y\nEffective area: X[${minX}→${maxX}] Y[${minY}→${maxY}]`:'';
  if(!confirm(`AUTOLEVEL SCAN\n\nGrid: ${gc} × ${gr} = ${gc*gr} points\nArea: X[${rawMinX}→${rawMaxX}] Y[${rawMinY}→${rawMaxY}]${offsetNote}\n\nEnsure Z is zeroed at work surface and ground clip is on.\n\nClick OK to begin.`)) return;
  al.probing=true; al.stopProbing=false;
  al.grid=Array.from({length:gr},()=>Array(gc).fill(null));
  al.totalPts=gc*gr; al.currentPt=0;
  addLog(`Autolevel: ${gc}×${gr} grid`,'sys'); render();
  // Build point list in snake order (boustrophedon)
  const pts=[];
  for(let row=0;row<gr;row++){
    const cols=row%2===0?[...Array(gc).keys()]:[...Array(gc).keys()].reverse();
    for(const col of cols) pts.push({row,col});
  }
  app.okQueue=[];
  try{
    for(const{row,col} of pts){
      if(al.stopProbing) break;
      al.currentPt++;
      const x=minX+(maxX-minX)*col/(gc-1);
      const y=minY+(maxY-minY)*row/(gr-1);
      addLog(`AL ${al.currentPt}/${al.totalPts}: X${x.toFixed(2)} Y${y.toFixed(2)}`,'sys');
      // Move to safe Z then XY
      await sendLine(`G90 G0 Z${safeZAL}`);
      await sendLine(`G90 G0 X${x.toFixed(3)} Y${y.toFixed(3)}`);
      // Probe — set up PRB capture first
      const prbP=waitForPRB(20000);
      await write(`G38.2 Z${probeDepth} F${probeFeed}`);
      addLog(`G38.2 Z${probeDepth} F${probeFeed}`,'tx');
      try{
        const prb=await prbP;
        await waitForOk(5000);
        if(prb.ok){
          // Convert to work Z using current WCO
          const wz=prb.z-(app.grbl.WCO?.[2]??0);
          al.grid[row][col]=wz;
          addLog(`  Z=${wz.toFixed(4)}`,'sys');
        } else {
          al.grid[row][col]=0;
          addLog(`  Probe fail — using 0`,'err');
        }
      } catch(ex){
        addLog(`  Timeout — using 0`,'err');
        al.grid[row][col]=0;
        await waitForOk(3000).catch(()=>{});
      }
      render();
    }
    // Normalize: subtract mean so corrections are centered around zero
    if(!al.stopProbing){
      const vals=al.grid.flat().filter(v=>v!==null);
      const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
      for(let r=0;r<gr;r++) for(let c=0;c<gc;c++){
        if(al.grid[r][c]!==null) al.grid[r][c]-=mean;
      }
      al.measured=true;
      await sendLine(`G90 G0 Z${safeZAL}`);
      saveAL();
      const range=(Math.max(...vals)-Math.min(...vals)).toFixed(4);
      addLog(`Autolevel done. Surface range: ${range}mm`,'sys');
      notify(`✓ Autolevel complete  range: ${range}mm`,'#06b6d4');
      showRemoveClipAlert();
    }
  } catch(e){
    addLog('Autolevel error: '+e.message,'err');
  }
  al.probing=false; render();
}

function stopAutolevel(){
  app.autolevel.stopProbing=true;
  // Retract to safe Z immediately so we don't drag across the work
  if(app.connected){
    const safeZ=app.autolevel.safeZAL||2;
    write(`G90 G0 Z${safeZ}`);
    addLog(`STOP SCAN — retracting to Z${safeZ}`,'sys');
  }
}

function buildHeightMap(){
  const al=app.autolevel;
  const{grid,gridCols:gc,gridRows:gr}=al;
  if(!al.measured||!grid.length) return null;
  let minZ=Infinity,maxZ=-Infinity;
  grid.forEach(row=>row.forEach(z=>{if(z!=null){minZ=Math.min(minZ,z);maxZ=Math.max(maxZ,z);}}));
  const range=maxZ-minZ||1;
  const wrap=h('div',{style:{marginBottom:'8px'}});
  wrap.appendChild(h('div',{style:{fontSize:'9px',color:C.muted,marginBottom:'4px',display:'flex',justifyContent:'space-between'}},
    h('span',{},'min: '+(minZ>=0?'+':'')+minZ.toFixed(3)+'mm'),
    h('span',{style:{color:'#06b6d4'}},`${gc}×${gr}`),
    h('span',{},' max: '+(maxZ>=0?'+':'')+maxZ.toFixed(3)+'mm')
  ));
  const grid2=h('div',{style:{display:'grid',gridTemplateColumns:`repeat(${gc},1fr)`,gap:'1px',
    background:C.border,borderRadius:'4px',overflow:'hidden'}});
  for(let row=gr-1;row>=0;row--){
    for(let col=0;col<gc;col++){
      const z=grid[row]?.[col];
      let bg=C.surface,txt='?';
      if(z!=null){
        const t=(z-minZ)/range;
        const r2=Math.round(255*Math.max(0,2*t-1));
        const g2=Math.round(255*Math.min(1,Math.min(2*t,2-2*t)));
        const b2=Math.round(255*Math.max(0,1-2*t));
        bg=`rgb(${r2},${g2},${b2})`;
        txt=(z>=0?'+':'')+z.toFixed(3);
      }
      grid2.appendChild(h('div',{style:{background:bg,padding:'3px 1px',textAlign:'center',
        fontSize:'8px',color:'rgba(255,255,255,0.9)',minHeight:'26px',
        display:'flex',alignItems:'center',justifyContent:'center'}},txt));
    }
  }
  wrap.appendChild(grid2);
  return wrap;
}

// ── DRAG + RESIZE ───────────────────────────────────────────────────────────
const SNAP=8;
function snap(v){return Math.round(v/SNAP)*SNAP;}
document.addEventListener('mousemove',e=>{
  if(app.drag){
    const i=app.panels.findIndex(p=>p.id===app.drag); if(i<0) return;
    app.panels[i]={...app.panels[i],
      x:snap(Math.max(0,e.clientX-app.dragOff.x)),
      y:snap(Math.max(48,e.clientY-app.dragOff.y))};
    render();
  }
  if(app.resize){
    const i=app.panels.findIndex(p=>p.id===app.resize); if(i<0) return;
    const{x:sx,y:sy,w:sw,h:sh}=app.resizeStart;
    // Per-panel minimum widths to prevent stepper inputs from overflowing
    const MIN_W={probe:300,autolevel:270,spindle:240,status:280,conn:220,jog:230,config:320};
    const minW=MIN_W[app.panels[i].id]||180;
    const newW=Math.max(minW,sw+(e.clientX-sx));
    const newH=sh!==null?Math.max(120,sh+(e.clientY-sy)):null;
    app.panels[i]={...app.panels[i],w:newW,h:newH};
    render();
  }
});
document.addEventListener('mouseup',()=>{
  if(app.drag||app.resize) savePanels();
  app.drag=null; app.resize=null; document.body.style.cursor='';
});

// ── PANEL BUILDER ───────────────────────────────────────────────────────────
function buildPanel(p){
  const hasFixedH=p.h!==null&&p.h!==undefined;
  const isCollapsed=!!p.collapsed;
  const panel=h('div',{style:{
    position:'absolute',left:p.x+'px',top:p.y+'px',width:p.w+'px',
    ...(hasFixedH&&!isCollapsed?{height:p.h+'px',overflow:'hidden'}:{}),
    background:C.surface,border:`1px solid ${p.accent}22`,borderRadius:'8px',
    boxShadow:'0 8px 32px rgba(0,0,0,0.3)'
  }});
  const tb=h('div',{
    style:{background:`${p.accent}14`,borderBottom:`1px solid ${p.accent}28`,
      padding:'7px 12px',cursor:'grab',display:'flex',alignItems:'center',
      justifyContent:'space-between',
      borderRadius:isCollapsed?'8px':'8px 8px 0 0',flexShrink:'0'},
    onMousedown:e=>{
      app.drag=p.id;
      app.dragOff={x:e.clientX-p.x,y:e.clientY-p.y};
      document.body.style.cursor='grabbing';
      e.preventDefault();
    }
  },
    h('span',{style:{fontSize:'10px',fontWeight:'700',color:p.accent,letterSpacing:'0.12em',pointerEvents:'none'}},p.title),
    h('div',{style:{display:'flex',gap:'6px',alignItems:'center'}},
      h('button',{
        style:{background:'transparent',border:'none',color:`${p.accent}80`,
          fontSize:'14px',lineHeight:'1',cursor:'pointer',padding:'0 2px',
          fontFamily:'inherit'},
        onMousedown:e=>e.stopPropagation(),
        onClick:e=>{
          e.stopPropagation();
          const i=app.panels.findIndex(q=>q.id===p.id);
          if(i>=0){ app.panels[i]={...app.panels[i],collapsed:!app.panels[i].collapsed}; savePanels(); render(); }
        }
      }, isCollapsed?'▶':'▼'),
      h('span',{style:{color:`${p.accent}50`,fontSize:'12px',pointerEvents:'none'}},'⣿')
    )
  );
  panel.appendChild(tb);
  if(isCollapsed) return panel;

  // Body
  const body=h('div',{style:{padding:'12px',overflow:hasFixedH?'auto':'visible',
    height:hasFixedH?`calc(100% - 34px)`:undefined}});

  // ── CONNECTION ─────────────────────────────────────────────────────────
  if(p.id==='conn'){
    // Transport mode badge
    const modeBadge=h('div',{style:{
      fontSize:'10px',fontWeight:'700',marginBottom:'8px',padding:'4px 8px',
      borderRadius:'4px',textAlign:'center',
      background: app.transport==='websocket'?'#06b6d415':
                  app.transport==='webserial'?'#22c55e15':'#ef444415',
      color: app.transport==='websocket'?'#06b6d4':
             app.transport==='webserial'?'#22c55e':'#ef4444',
      border:`1px solid ${app.transport==='websocket'?'#06b6d430':
              app.transport==='webserial'?'#22c55e30':'#ef444430'}`,
    }},
      app.transport==='websocket' ? `⬛ SERVER MODE  ·  ${app.wsClientCount} viewer${app.wsClientCount!==1?'s':''}` :
      app.transport==='webserial' ? '⚡ LOCAL MODE  ·  Web Serial' :
      app.transport==='detecting' ? '⏳ Detecting…' :
      '⚠ No transport available'
    );
    body.appendChild(modeBadge);

    // Port selector (server mode) or baud (local mode)
    if(app.transport==='websocket'){
      // Port dropdown from server
      const pr=h('div',{style:{marginBottom:'10px'}});
      const portSel=h('select',{style:{width:'100%',background:C.bg,color:C.text,
        border:`1px solid ${C.border}`,borderRadius:'5px',padding:'5px 8px',
        fontSize:'12px',fontFamily:'inherit',marginBottom:'6px'},
        onChange:e=>{app.selectedPort=e.target.value;}});
      if(!app.availablePorts.length){
        portSel.appendChild(h('option',{},'No ports found'));
        portSel.disabled=true;
      } else {
        app.availablePorts.forEach(p2=>{
          const o=h('option',{value:p2.path},`${p2.path}  ${p2.manufacturer?'('+p2.manufacturer+')':''}`);
          if(p2.path===app.selectedPort) o.selected=true;
          portSel.appendChild(o);
        });
      }
      pr.appendChild(portSel);
      // Baud row
      const br2=h('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'6px'}});
      br2.appendChild(h('span',{style:{fontSize:'11px',color:C.muted}},'BAUD'));
      const sel2=h('select',{style:{background:C.bg,color:C.text,border:`1px solid ${C.border}`,
        borderRadius:'5px',padding:'4px 8px',fontSize:'12px',fontFamily:'inherit'},
        onChange:e=>{app.baud=+e.target.value;}});
      [9600,115200,230400,1000000].forEach(b=>{
        const o=h('option',{value:b},b+''); if(b===app.baud) o.selected=true; sel2.appendChild(o);
      });
      br2.appendChild(sel2);
      pr.appendChild(br2);
      body.appendChild(pr);
      // Refresh ports button
      const rfRow=h('div',{style:{display:'flex',gap:'6px',marginBottom:'10px'}});
      rfRow.appendChild(mkBtn('↺ Refresh Ports',async()=>{
        const r=await fetch('/api/ports'); const ports=await r.json();
        app.availablePorts=ports; if(ports.length) app.selectedPort=ports[0].path; render();
      },'#06b6d4',{small:true,full:true}));
      body.appendChild(rfRow);
    } else {
      const br=h('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'10px'}},
        h('span',{style:{fontSize:'11px',color:C.muted}},'BAUD'));
      const sel=h('select',{style:{background:C.bg,color:C.text,border:`1px solid ${C.border}`,
        borderRadius:'5px',padding:'4px 8px',fontSize:'12px',fontFamily:'inherit'},
        onChange:e=>{app.baud=+e.target.value;}});
      [9600,115200,230400,1000000].forEach(b=>{
        const o=h('option',{value:b},b+''); if(b===app.baud) o.selected=true; sel.appendChild(o);
      });
      br.appendChild(sel); body.appendChild(br);
    }

    const canConnect=app.transport==='websocket'?!!app.selectedPort:app.transport==='webserial';
    body.appendChild(app.connected
      ?mkBtn('✕  DISCONNECT',disconnect,'#ef4444',{full:true})
      :mkBtn(app.transport==='websocket'?'⬛  CONNECT VIA SERVER':'⚡  CONNECT USB',
        connect,'#22c55e',{full:true,disabled:!canConnect||app.transport==='detecting'}));
  }

  // ── STATUS ─────────────────────────────────────────────────────────────
  if(p.id==='status'){
    const mpos=app.grbl.MPos||[0,0,0];
    const wco=app.grbl.WCO||[0,0,0];
    const wpos=mpos.map((v,i)=>v-wco[i]);
    const sc=STATE_COLOR[app.grbl.state]||'#334155';
    const feed=(app.grbl.FS||[0,0])[0],rpm=(app.grbl.FS||[0,0])[1];

    // ── Per-axis columns ──────────────────────────────────────────────────
    const axisColors=['#ef4444','#22c55e','#3b82f6'];
    const axisLetters=['X','Y','Z'];
    const axisZeroCmds=['G10 L20 P1 X0','G10 L20 P1 Y0','G10 L20 P1 Z0'];
    const axisHomeCmds=['$HX','$HY','$HZ'];
    const wIds=['wx','wy','wz'], mIds=['mx','my','mz'];

    const colsRow=h('div',{style:{display:'flex',gap:'6px',marginBottom:'10px'}});
    axisLetters.forEach((ax,i)=>{
      const col=h('div',{style:{flex:'1',display:'flex',flexDirection:'column',gap:'4px'}});

      // Axis label pill
      col.appendChild(h('div',{style:{textAlign:'center',fontSize:'11px',fontWeight:'800',
        letterSpacing:'0.12em',padding:'2px 0',borderRadius:'5px',
        background:`${axisColors[i]}20`,color:axisColors[i],border:`1px solid ${axisColors[i]}40`}},ax));

      // WORK value — big & prominent
      const wBox=h('div',{style:{background:`${axisColors[i]}12`,border:`1px solid ${axisColors[i]}35`,
        borderRadius:'7px',padding:'6px 4px',textAlign:'center'}});
      wBox.appendChild(h('div',{style:{fontSize:'9px',color:`${axisColors[i]}99`,
        marginBottom:'2px',letterSpacing:'0.08em'}},'WORK'));
      const wVal=h('div',{id:wIds[i],style:{fontSize:'17px',fontWeight:'800',
        color:axisColors[i],fontVariantNumeric:'tabular-nums',letterSpacing:'-0.01em'}},
        wpos[i].toFixed(3));
      wBox.appendChild(wVal);
      col.appendChild(wBox);

      // Home + Zero buttons
      const btnRow=h('div',{style:{display:'flex',gap:'3px'}});
      // Home
      btnRow.appendChild(h('button',{
        style:{flex:'1',background:'transparent',border:`1px solid ${app.connected?'#06b6d440':C.border}`,
          color:app.connected?'#06b6d4':C.muted,borderRadius:'5px',padding:'4px 2px',
          fontSize:'20px',lineHeight:'1',cursor:app.connected?'pointer':'not-allowed',fontFamily:'inherit',
          opacity:app.connected?'1':'0.4'},
        onClick:app.connected?()=>{app.homing=true;write(axisHomeCmds[i]);addLog(axisHomeCmds[i],'tx');}:null
      },'⌂'));
      // Zero
      btnRow.appendChild(h('button',{
        style:{flex:'1',background:'transparent',border:`1px solid ${app.connected?axisColors[i]+'40':C.border}`,
          color:app.connected?axisColors[i]:C.muted,borderRadius:'5px',padding:'4px 2px',
          fontSize:'18px',fontWeight:'800',lineHeight:'1',cursor:app.connected?'pointer':'not-allowed',
          fontFamily:'inherit',opacity:app.connected?'1':'0.4'},
        onClick:app.connected?()=>{write(axisZeroCmds[i]);addLog(axisZeroCmds[i],'tx');}:null
      },'0'));
      col.appendChild(btnRow);

      // MACH value — smaller, muted
      const mBox=h('div',{style:{background:C.bg,borderRadius:'6px',padding:'4px',textAlign:'center'}});
      mBox.appendChild(h('div',{style:{fontSize:'9px',color:C.muted,marginBottom:'1px',letterSpacing:'0.08em'}},'MACH'));
      const mVal=h('div',{id:mIds[i],style:{fontSize:'12px',fontWeight:'600',
        color:C.muted,fontVariantNumeric:'tabular-nums'}},mpos[i].toFixed(3));
      mBox.appendChild(mVal);
      col.appendChild(mBox);

      colsRow.appendChild(col);
    });
    body.appendChild(colsRow);
    body.appendChild(sep());

    // ── Feed / Spindle / State row ─────────────────────────────────────────
    const sr=h('div',{style:{display:'flex',gap:'6px',marginBottom:'8px'}});
    [['FEED',feed,'#22c55e','grbl-feed'],['SPINDLE',rpm,'#f59e0b','grbl-rpm'],['STATE',app.grbl.state,sc,'grbl-state']].forEach(([l,v,c,id])=>{
      const valEl=h('div',{id,style:{fontSize:l==='STATE'?'12px':'16px',fontWeight:'700',color:c}},''+v);
      sr.appendChild(h('div',{style:{flex:'1',background:C.bg,borderRadius:'6px',padding:'5px 8px'}},
        h('div',{style:{fontSize:'9px',color:C.muted,marginBottom:'2px'}},l), valEl));
    });
    body.appendChild(sr);
    body.appendChild(sep());

    // ── Action buttons row ────────────────────────────────────────────────
    const ar=h('div',{style:{display:'flex',gap:'5px',marginBottom:'8px'}});
    ar.appendChild(mkBtn('⌂ Go To Zero',()=>{write('G90G0X0Y0');addLog('G90G0X0Y0','tx');},'#06b6d4',{small:true,disabled:!app.connected,full:true}));
    ar.appendChild(mkBtn('↺ Zero All',()=>{write('G10 L20 P1 X0 Y0 Z0');addLog('G10 L20 P1 X0 Y0 Z0','tx');},'#3b82f6',{small:true,disabled:!app.connected,full:true}));
    ar.appendChild(mkBtn('⌂ Home All',()=>{app.homing=true;write('$H');addLog('$H','tx');},'#06b6d4',{small:true,disabled:!app.connected,full:true}));
    body.appendChild(ar);
    // Unlock button separately — less prominent
    body.appendChild(mkBtn('🔓 Unlock ($X)',()=>{write('$X');addLog('$X','tx');render();},'#a855f7',{small:true,disabled:!app.connected,full:true}));
    // ── OVERRIDES ──────────────────────────────────────────────────────────
    body.appendChild(sep());
    const ov=app.grbl.Ov||[100,100,100];
    const ovLabel=h('div',{id:'ov-label',style:{fontSize:'10px',fontWeight:'700',color:'#64748b',
      letterSpacing:'0.1em',marginBottom:'6px'}},`OVERRIDES  ·  F:${ov[0]}%  R:${ov[1]}%  S:${ov[2]}%`);
    body.appendChild(ovLabel);
    // Feed override row
    const fovRow=h('div',{style:{display:'flex',gap:'4px',alignItems:'center',marginBottom:'5px'}});
    fovRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted,width:'40px'}},'FEED'));
    [['−10','\x92'],['−1','\x94'],['100%','\x90'],['+1','\x93'],['+10','\x91']].forEach(([l,b])=>{
      fovRow.appendChild(h('button',{style:{background:'transparent',border:`1px solid ${C.border}`,
        color:b==='\x90'?'#22c55e':C.muted,borderRadius:'4px',padding:'3px 7px',fontSize:'11px',
        cursor:!app.connected?'not-allowed':'pointer',fontFamily:'inherit',
        opacity:app.connected?'1':'0.4'},
        onClick:app.connected?()=>write(b,true):null},l));
    });
    body.appendChild(fovRow);
    // Spindle override row
    const sovRow=h('div',{style:{display:'flex',gap:'4px',alignItems:'center'}});
    sovRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted,width:'40px'}},'SPNDL'));
    [['-10','\x9b'],['-1','\x9d'],['100%','\x99'],['+1','\x9c'],['+10','\x9a']].forEach(([l,b])=>{
      sovRow.appendChild(h('button',{style:{background:'transparent',border:`1px solid ${C.border}`,
        color:b==='\x99'?'#f97316':C.muted,borderRadius:'4px',padding:'3px 7px',fontSize:'11px',
        cursor:!app.connected?'not-allowed':'pointer',fontFamily:'inherit',
        opacity:app.connected?'1':'0.4'},
        onClick:app.connected?()=>write(b,true):null},l));
    });
    body.appendChild(sovRow);
  }

  // ── JOG ────────────────────────────────────────────────────────────────
  if(p.id==='jog'){
    const sr=h('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap',marginBottom:'10px',alignItems:'center'}});
    [0.01,0.1,1,5,10,50].forEach(s=>{
      const a=app.jogStep===s;
      sr.appendChild(h('button',{style:{background:a?'#f59e0b22':'transparent',
        border:`1px solid ${a?'#f59e0b':C.border}`,color:a?'#f59e0b':C.muted,
        borderRadius:'4px',padding:'3px 8px',fontSize:'11px',cursor:'pointer',fontFamily:'inherit'},
        onClick:()=>{app.jogStep=s;render();}},s+''));
    });
    sr.appendChild(h('span',{style:{fontSize:'11px',color:C.muted}},'mm'));
    body.appendChild(sr);
    // 3×3 jog grid with diagonals — center is jog cancel (0x85)
    const xyG=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'4px',marginBottom:'8px'}});
    const jogItems=[
      {l:'↖', f:()=>{const s=app.jogStep;write(`$J=G21G91X-${s}Y${s}F${app.jogFeed}`);}},
      {l:'Y+', f:()=>jog('Y',1)},
      {l:'↗', f:()=>{const s=app.jogStep;write(`$J=G21G91X${s}Y${s}F${app.jogFeed}`);}},
      {l:'X-', f:()=>jog('X',-1)},
      {l:'⏹',  f:()=>write('\x85',true), cancel:true},
      {l:'X+', f:()=>jog('X',1)},
      {l:'↙', f:()=>{const s=app.jogStep;write(`$J=G21G91X-${s}Y-${s}F${app.jogFeed}`);}},
      {l:'Y-', f:()=>jog('Y',-1)},
      {l:'↘', f:()=>{const s=app.jogStep;write(`$J=G21G91X${s}Y-${s}F${app.jogFeed}`);}},
    ];
    jogItems.forEach(item=>{
      const isDiag=item.l.length===2&&['↖','↗','↙','↘'].includes(item.l);
      const isCancel=item.cancel;
      xyG.appendChild(h('button',{style:{
        background:!app.connected?'transparent':isCancel?'#ef444414':isDiag?'#f59e0b08':'#f59e0b14',
        border:`1px solid ${!app.connected?C.border:isCancel?'#ef444435':isDiag?'#f59e0b25':'#f59e0b35'}`,
        color:!app.connected?C.muted:isCancel?'#ef4444':isDiag?'#f59e0baa':'#f59e0b',
        borderRadius:'6px',padding:'10px 4px',fontSize:isDiag?'14px':'12px',fontWeight:'700',
        cursor:!app.connected?'not-allowed':'pointer',fontFamily:'inherit'},
        onClick:app.connected?item.f:null},item.l));
    });
    body.appendChild(xyG);
    // Z step selector — separate from XY step
    const zStepRow=h('div',{style:{display:'flex',gap:'4px',alignItems:'center',marginBottom:'6px',flexWrap:'wrap'}});
    zStepRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted,marginRight:'2px'}},'Z step:'));
    [0.01,0.1,0.5,1,5,10].forEach(s=>{
      const a=app.jogStepZ===s;
      zStepRow.appendChild(h('button',{style:{
        background:a?'#a855f722':'transparent',
        border:`1px solid ${a?'#a855f7':C.border}`,color:a?'#a855f7':C.muted,
        borderRadius:'4px',padding:'3px 7px',fontSize:'11px',cursor:'pointer',fontFamily:'inherit'},
        onClick:()=>{app.jogStepZ=s;render();}},s+''));
    });
    body.appendChild(zStepRow);
    const zr=h('div',{style:{display:'flex',gap:'4px',justifyContent:'center',marginBottom:'10px'}});
    [{l:'Z+',d:1},{l:'Z-',d:-1}].forEach(({l,d})=>{
      zr.appendChild(h('button',{style:{background:!app.connected?'transparent':'#a855f714',
        border:`1px solid ${!app.connected?C.border:'#a855f735'}`,color:!app.connected?C.muted:'#a855f7',
        borderRadius:'6px',padding:'8px 22px',fontSize:'12px',fontWeight:'700',
        cursor:!app.connected?'not-allowed':'pointer',fontFamily:'inherit'},
        onClick:app.connected?()=>jog('Z',d):null},l));
    });
    body.appendChild(zr);
    body.appendChild(mkRow('Jog Feed',mkNum(app.jogFeed,v=>{app.jogFeed=v;},'72px','1'),'mm/min'));
    // Run + Frame moved here from File panel
    if(app.glines.length>0){
      body.appendChild(sep());
      const bar=h('div',{style:{background:C.bg,borderRadius:'3px',height:'4px',overflow:'hidden',marginBottom:'6px'}});
      bar.appendChild(h('div',{style:{width:app.progress+'%',height:'100%',background:'#a855f7',transition:'width 0.2s'}}));
      body.appendChild(bar);
      const br=h('div',{style:{display:'flex',gap:'6px'}});
      if(!app.sending){
        br.appendChild(mkBtn('▶  RUN',runFile,'#22c55e',{disabled:!app.connected,full:true}));
        br.appendChild(mkBtn('⬜ FRAME',frameJob,'#06b6d4',{small:true,disabled:!app.connected}));
      } else {
        br.appendChild(mkBtn('⬛  STOP',stopFile,'#ef4444',{full:true}));
      }
      body.appendChild(br);
      if(app.autolevel.enabled&&app.autolevel.measured)
        body.appendChild(h('div',{style:{fontSize:'10px',color:'#06b6d4',marginTop:'4px'}},'⬛ AL active'));
    }
  }

  // ── FILE ───────────────────────────────────────────────────────────────
  if(p.id==='file'){
    const fl=h('label',{style:{background:'#a855f710',border:'1px dashed #a855f740',borderRadius:'6px',
      padding:'14px 10px',textAlign:'center',cursor:'pointer',display:'block',
      color:'#a855f7',fontSize:'12px',marginBottom:'10px',lineHeight:'1.5'}},
      app.gfile?`📄 ${app.gfile}`:'📁 Click to load G-code');
    fl.appendChild(h('input',{type:'file',accept:'.nc,.gcode,.tap,.cnc,.txt',
      style:{display:'none'},onChange:loadFile}));
    body.appendChild(fl);
    if(app.glines.length>0){
      body.appendChild(h('div',{style:{fontSize:'11px',color:C.muted,marginBottom:'4px'}},`${app.glines.length} lines  ·  use Run/Frame in Jog panel`));
      if(app.jobTimeEst) body.appendChild(h('div',{style:{fontSize:'11px',color:'#06b6d4',marginBottom:'4px'}},`⏱ Est. time: ${app.jobTimeEst}`));
      if(app.sending) body.appendChild(h('div',{style:{fontSize:'11px',color:'#a855f7',marginBottom:'4px'}},app.progress+'%'));
      body.appendChild(mkBtn('✕ Clear file',()=>{app.gfile=null;app.glines=[];app.progress=0;render();},C.muted,{small:true}));
      if(app.autolevel.enabled&&app.autolevel.measured)
        body.appendChild(h('div',{style:{fontSize:'10px',color:'#06b6d4',marginTop:'6px'}},'⬛ Autolevel active'));
    }
  }

  // ── PROBE ──────────────────────────────────────────────────────────────
  if(p.id==='probe'){
    // PCB Home button — shown when configured in Config panel
    if(app.settings.pcbHomeEnabled){
      const pcbBtn=h('div',{style:{marginBottom:'10px'}});
      pcbBtn.appendChild(mkBtn(
        `⌂ GOTO PCB HOME  (M:${app.settings.pcbHomeX}, ${app.settings.pcbHomeY})`,
        ()=>{
          if(!app.connected){addLog('Not connected','err');return;}
          const safeZ=app.settings.safeZ||5;
          const x=app.settings.pcbHomeX, y=app.settings.pcbHomeY;
          // Raise to safe Z first, then move in machine coords, then zero XY work
          const seq=[
            `G90 G0 Z${safeZ}`,
            `G53 G0 X${x} Y${y}`,
            'G10 L20 P1 X0 Y0',
          ];
          (async()=>{
            for(const cmd of seq){ await sendLine(cmd); addLog(cmd,'tx'); }
            notify(`✓ PCB Home — Work X0 Y0 set`,'#f97316');
            render();
          })().catch(e=>{ addLog('PCB Home error: '+e.message,'err'); });
        },
        '#f97316',{full:true,disabled:!app.connected}
      ));
      body.appendChild(pcbBtn);
    }
    const ss=h('div',{style:{background:C.bg+'aa',border:`1px solid ${C.border}`,
      borderRadius:'6px',padding:'10px',marginBottom:'10px'}});
    ss.appendChild(h('div',{style:{fontSize:'10px',fontWeight:'700',color:'#ef4444',
      marginBottom:'8px',letterSpacing:'0.1em'}},'PROBE SETTINGS'));
    // Endmill
    const er=h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',alignItems:'center',marginBottom:'8px'}});
    er.appendChild(h('span',{style:{fontSize:'10px',color:C.muted,width:'100%'}},'Endmill'));
    [{l:'1/4"',v:6.35},{l:'1/8"',v:3.175},{l:'3mm',v:3},{l:'6mm',v:6}].forEach(({l,v})=>{
      const a=Math.abs(app.settings.endmill-v)<0.01;
      er.appendChild(h('button',{style:{background:a?'#ef444422':'transparent',
        border:`1px solid ${a?'#ef4444':C.border}`,color:a?'#ef4444':C.muted,
        borderRadius:'4px',padding:'3px 8px',fontSize:'11px',cursor:'pointer',fontFamily:'inherit'},
        onClick:()=>{app.settings.endmill=v;saveSettings();render();}},l));
    });
    er.appendChild(mkNum(app.settings.endmill,v=>{app.settings.endmill=v;saveSettings();render();},'52px'));
    er.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},'mm'));
    ss.appendChild(er);
    ss.appendChild(sep());
    ss.appendChild(mkRow('Z-only plate thickness',mkNum(app.settings.plateZ_zonly,v=>{app.settings.plateZ_zonly=v;saveSettings();},'68px'),'mm'));
    ss.appendChild(mkRow('XYZ plate Z thickness', mkNum(app.settings.plateZ_xyz,  v=>{app.settings.plateZ_xyz=v; saveSettings();},'68px'),'mm'));
    ss.appendChild(mkRow('XYZ plate X thickness', mkNum(app.settings.plateX,      v=>{app.settings.plateX=v;     saveSettings();},'68px'),'mm'));
    ss.appendChild(mkRow('XYZ plate Y thickness', mkNum(app.settings.plateY,      v=>{app.settings.plateY=v;     saveSettings();},'68px'),'mm'));
    ss.appendChild(sep());
    ss.appendChild(mkRow('Fast probe feed',  mkNum(app.settings.probeFeedFast,v=>{app.settings.probeFeedFast=v;saveSettings();},'68px','1'),'mm/min'));
    ss.appendChild(mkRow('Fine probe feed',  mkNum(app.settings.probeFeedFine,v=>{app.settings.probeFeedFine=v;saveSettings();},'68px','1'),'mm/min'));
    ss.appendChild(mkRow('Max probe travel', mkNum(app.settings.probeMaxZ,    v=>{app.settings.probeMaxZ=v;    saveSettings();},'68px','1'),'mm'));
    body.appendChild(ss);
    // Probe buttons
    const pb=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px',marginBottom:'8px'}});
    [['▼ Z only',probeZ_only,'#ef4444'],['⊕ XYZ',probeXYZ,'#ef4444'],['◎ PCB Z',probePCB,'#f59e0b']]
      .forEach(([l,fn,c])=>pb.appendChild(mkBtn(l,fn,c,{disabled:!app.connected})));
    body.appendChild(pb);
    // Quick zero
    const qz=h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap'}});
    ['X','Y','Z'].forEach(a=>qz.appendChild(mkBtn(`Zero ${a}`,()=>{const c=`G10 L20 P1 ${a}0`;write(c);addLog(c,'tx');render();},'#3b82f6',{small:true,disabled:!app.connected})));
    qz.appendChild(mkBtn('Zero All',()=>{write('G10 L20 P1 X0 Y0 Z0');addLog('G10 L20 P1 X0 Y0 Z0','tx');render();},'#22c55e',{small:true,disabled:!app.connected}));
    body.appendChild(qz);
  }

  // ── AUTOLEVEL ──────────────────────────────────────────────────────────
  if(p.id==='autolevel'){
    const al=app.autolevel;
    // Enable toggle
    const enRow=h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}});
    const enChk=h('input',{type:'checkbox',style:{cursor:'pointer'},onChange:e=>{al.enabled=e.target.checked;saveAL();render();}});
    enChk.checked=al.enabled;
    enChk.disabled=!al.measured;
    enRow.appendChild(enChk);
    enRow.appendChild(h('span',{style:{fontSize:'11px',color:al.measured?'#06b6d4':C.muted}},
      al.measured?'Apply autolevel to job':'Measure surface first'));
    body.appendChild(enRow);

    if(al.probing){
      // Probing in progress
      body.appendChild(h('div',{style:{fontSize:'11px',color:'#06b6d4',marginBottom:'8px'}},
        `Probing ${al.currentPt}/${al.totalPts}…`));
      const pb=h('div',{style:{background:C.bg,borderRadius:'3px',height:'5px',overflow:'hidden',marginBottom:'10px'}});
      pb.appendChild(h('div',{style:{width:`${al.totalPts?Math.round(al.currentPt/al.totalPts*100):0}%`,
        height:'100%',background:'#06b6d4',transition:'width 0.3s'}}));
      body.appendChild(pb);
      body.appendChild(mkBtn('⬛ STOP SCAN',stopAutolevel,'#ef4444',{full:true}));
    } else {
      // Settings
      const gs=h('div',{style:{background:C.bg+'aa',border:`1px solid ${C.border}`,
        borderRadius:'6px',padding:'10px',marginBottom:'10px'}});
      gs.appendChild(h('div',{style:{fontSize:'10px',fontWeight:'700',color:'#06b6d4',marginBottom:'8px',letterSpacing:'0.1em'}},'SCAN SETTINGS'));
      // Grid size
      const gridRow=h('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'6px'}});
      gridRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted,flex:'1'}},'Grid'));
      gridRow.appendChild(mkNum(al.gridCols,v=>{al.gridCols=Math.max(2,Math.round(v));render();},'38px','1'));
      gridRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},'×'));
      gridRow.appendChild(mkNum(al.gridRows,v=>{al.gridRows=Math.max(2,Math.round(v));render();},'38px','1'));
      gridRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},`= ${al.gridCols*al.gridRows} pts`));
      gs.appendChild(gridRow);
      gs.appendChild(mkRow('X min → max',
        h('div',{style:{display:'flex',gap:'4px'}},
          mkNum(al.minX,v=>{al.minX=v;},'65px'),
          h('span',{style:{fontSize:'10px',color:C.muted,alignSelf:'center'}},'→'),
          mkNum(al.maxX,v=>{al.maxX=v;},'65px')),'mm'));
      gs.appendChild(mkRow('Y min → max',
        h('div',{style:{display:'flex',gap:'4px'}},
          mkNum(al.minY,v=>{al.minY=v;},'65px'),
          h('span',{style:{fontSize:'10px',color:C.muted,alignSelf:'center'}},'→'),
          mkNum(al.maxY,v=>{al.maxY=v;},'65px')),'mm'));

      // Border offset row
      gs.appendChild(sep());
      const offRow=h('div',{style:{display:'flex',gap:'6px',alignItems:'center',padding:'2px 0'}});
      offRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted,flex:'1'}},'Border offset'));
      offRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},'X'));
      offRow.appendChild(mkNum(al.scanOffsetX||0,v=>{al.scanOffsetX=Math.max(0,v);},'40px'));
      offRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},'Y'));
      offRow.appendChild(mkNum(al.scanOffsetY||0,v=>{al.scanOffsetY=Math.max(0,v);},'40px'));
      offRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},'mm'));
      gs.appendChild(offRow);
      // Show effective bounds if offset is active
      const offX=al.scanOffsetX||0, offY=al.scanOffsetY||0;
      if(offX>0||offY>0){
        const effMinX=al.minX+offX, effMaxX=al.maxX-offX;
        const effMinY=al.minY+offY, effMaxY=al.maxY-offY;
        const valid=effMinX<effMaxX&&effMinY<effMaxY;
        gs.appendChild(h('div',{style:{fontSize:'10px',
          color:valid?'#06b6d4':'#ef4444',padding:'3px 0',lineHeight:'1.6'}},
          valid
            ?`↳ Scans X[${effMinX}→${effMaxX}]  Y[${effMinY}→${effMaxY}]`
            :'⚠ Offset too large — no scan area'));
      }

      gs.appendChild(sep());
      gs.appendChild(mkRow('Probe depth', mkNum(al.probeDepth,v=>{al.probeDepth=v;},'65px'),'mm'));
      gs.appendChild(mkRow('Probe feed',  mkNum(al.probeFeed, v=>{al.probeFeed=v;}, '48px','1'),'mm/min'));
      gs.appendChild(mkRow('Safe Z (AL)', mkNum(al.safeZAL,   v=>{al.safeZAL=v;},  '48px'),'mm'));
      body.appendChild(gs);

      const br2=h('div',{style:{display:'flex',gap:'6px',marginBottom:'8px'}});
      br2.appendChild(mkBtn('📐 FROM FILE',()=>{
        if(!app.glines.length){addLog('Load a G-code file first','err');render();return;}
        const{minX,maxX,minY,maxY}=parseExtents(app.glines);
        if(isFinite(minX)){al.minX=Math.floor(minX);al.maxX=Math.ceil(maxX);al.minY=Math.floor(minY);al.maxY=Math.ceil(maxY);}
        render();
      },'#06b6d4',{small:true}));
      // Load saved scan JSON
      const loadScanInput=h('input',{type:'file',accept:'.json',style:{display:'none'}});
      loadScanInput.addEventListener('change',e=>{
        const f=e.target.files[0]; if(!f) return;
        const r=new FileReader();
        r.onload=ev=>{
          try{
            const d=JSON.parse(ev.target.result);
            if(!d.grid||!d.gridCols||!d.gridRows) throw new Error('Not a valid scan file');
            Object.assign(app.autolevel,{
              grid:d.grid, gridCols:d.gridCols, gridRows:d.gridRows,
              minX:d.minX, maxX:d.maxX, minY:d.minY, maxY:d.maxY,
              scanOffsetX:d.scanOffsetX||0, scanOffsetY:d.scanOffsetY||0,
              measured:true, enabled:d.enabled||false,
            });
            saveAL();
            notify('✓ Scan loaded: '+f.name,'#06b6d4');
            render();
          }catch(err){
            addLog('Invalid scan file: '+err.message,'err');
            notify('⚠ Invalid scan file','#ef4444');
          }
        };
        r.readAsText(f); e.target.value='';
      });
      const loadScanBtn=mkBtn('📂 LOAD SCAN',()=>loadScanInput.click(),'#06b6d4',{small:true});
      br2.appendChild(loadScanBtn);
      br2.appendChild(loadScanInput);
      br2.appendChild(mkBtn('▶ SCAN SURFACE',startAutolevel,'#06b6d4',{disabled:!app.connected,full:true}));
      body.appendChild(br2);

      // Height map display
      const hmap=buildHeightMap();
      if(hmap) body.appendChild(hmap);

      if(al.measured){
        const mapBtns=h('div',{style:{display:'flex',gap:'6px'}});
        mapBtns.appendChild(mkBtn('💾 SAVE SCAN',()=>{
          const data=JSON.stringify({
            enabled:al.enabled,measured:al.measured,
            gridCols:al.gridCols,gridRows:al.gridRows,
            minX:al.minX,maxX:al.maxX,minY:al.minY,maxY:al.maxY,
            grid:al.grid,
          },null,2);
          const blob=new Blob([data],{type:'application/json'});
          const a=document.createElement('a');
          a.href=URL.createObjectURL(blob);
          a.download=`demonx-scan-${new Date().toISOString().slice(0,16).replace(/[T:]/g,'-')}.json`;
          a.click();
          URL.revokeObjectURL(a.href);
          notify('✓ Scan saved','#06b6d4');
        },'#06b6d4',{small:true,full:true}));
        mapBtns.appendChild(mkBtn('✕ CLEAR MAP',()=>{
          al.measured=false;al.enabled=false;al.grid=[];saveAL();render();
        },'#ef4444',{small:true,full:true}));
        body.appendChild(mapBtns);
      }
    }
  }

  // ── SPINDLE ────────────────────────────────────────────────────────────
  if(p.id==='spindle'){
    const rpm=(app.grbl.FS||[0,0])[1];
    const isOn=rpm>0;
    // Live RPM readout
    const rpmBox=h('div',{id:'spindle-rpm-box',style:{background:C.bg,borderRadius:'6px',padding:'8px',
      textAlign:'center',marginBottom:'10px',border:`1px solid ${isOn?'#f9731640':C.border}`}});
    rpmBox.appendChild(h('div',{style:{fontSize:'9px',color:C.muted,marginBottom:'2px'}},'SPINDLE RPM'));
    rpmBox.appendChild(h('div',{id:'spindle-rpm-val',style:{fontSize:'22px',fontWeight:'700',
      color:isOn?'#f97316':C.muted,fontVariantNumeric:'tabular-nums'}},rpm+''));
    rpmBox.appendChild(h('div',{id:'spindle-rpm-state',style:{fontSize:'10px',color:isOn?'#22c55e':'#ef4444',
      marginTop:'2px'}},isOn?'● RUNNING':'■ STOPPED'));
    body.appendChild(rpmBox);

    // Speed input + presets
    const speedRow=h('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'8px'}});
    speedRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},'S'));
    const speedInp=h('input',{type:'number',value:app.spindleSpeed,min:'0',max:'30000',step:'100',
      style:{flex:'1',background:C.bg,color:C.text,border:`1px solid ${C.border}`,
        borderRadius:'5px',padding:'5px 8px',fontSize:'13px',outline:'none',fontFamily:'inherit'}});
    speedInp.addEventListener('input',e=>{app.spindleSpeed=parseInt(e.target.value)||0;});
    speedRow.appendChild(speedInp);
    speedRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},'RPM'));
    body.appendChild(speedRow);

    // Speed presets
    const presetRow=h('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap',marginBottom:'10px'}});
    [1000,5000,10000,18000,24000].forEach(s=>{
      presetRow.appendChild(h('button',{style:{background:'transparent',
        border:`1px solid ${C.border}`,color:C.muted,
        borderRadius:'4px',padding:'3px 7px',fontSize:'11px',
        cursor:'pointer',fontFamily:'inherit'},
        onClick:()=>{app.spindleSpeed=s;speedInp.value=s;}},s/1000+'k'));
    });
    body.appendChild(presetRow);

    body.appendChild(sep());

    // On/Off/Dir buttons
    const btnRow=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px',marginBottom:'8px'}});
    // M3 CW
    btnRow.appendChild(mkBtn('↻ CW  ON',()=>{
      const cmd=`M3 S${app.spindleSpeed}`;
      write(cmd);addLog(cmd,'tx');render();
    },'#22c55e',{disabled:!app.connected}));
    // M5 Off
    btnRow.appendChild(mkBtn('■  OFF',()=>{
      write('M5');addLog('M5','tx');render();
    },'#ef4444',{disabled:!app.connected}));
    body.appendChild(btnRow);

    // Speed-only update (while already running)
    body.appendChild(mkBtn('↑ Update Speed (M3)',()=>{
      const cmd=`M3 S${app.spindleSpeed}`;
      write(cmd);addLog(cmd,'tx');render();
    },'#f97316',{full:true,disabled:!app.connected}));

    body.appendChild(sep());
    body.appendChild(h('div',{style:{fontSize:'10px',color:C.muted,lineHeight:'1.7'}},
      'M3 = CW  ·  M4 = CCW  ·  M5 = Off\nS value sent with spindle on command.'));
  }

  // ── CONFIG ($$ viewer/editor) ──────────────────────────────────────────
  if(p.id==='config'){
    // ── PCB FIXTURE HOME ───────────────────────────────────────────────────
    const pcbSection=h('div',{style:{marginBottom:'10px',padding:'8px',
      background:'#f9731608',border:'1px solid #f9731625',borderRadius:'6px'}});
    pcbSection.appendChild(h('div',{style:{fontSize:'10px',fontWeight:'700',
      color:'#f97316',letterSpacing:'0.1em',marginBottom:'6px'}},'PCB FIXTURE HOME'));
    pcbSection.appendChild(h('div',{style:{fontSize:'10px',color:C.muted,marginBottom:'6px',lineHeight:'1.6'}},
      'Use MACHINE coords (MPos) — these never change after homing.'));

    // X / Y inputs + Capture button
    const coordRow=h('div',{style:{display:'flex',gap:'5px',alignItems:'center',marginBottom:'6px'}});
    coordRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted,width:'14px'}},'X'));
    const xInp=h('input',{type:'number',value:app.settings.pcbHomeX,step:'0.001',
      style:{width:'80px',background:C.bg,color:C.text,border:`1px solid ${C.border}`,
        borderRadius:'4px',padding:'4px 6px',fontSize:'12px',outline:'none',fontFamily:'inherit'}});
    xInp.addEventListener('input',e=>{app.settings.pcbHomeX=parseFloat(e.target.value)||0;saveSettings();});
    coordRow.appendChild(xInp);
    coordRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted,width:'14px',marginLeft:'4px'}},'Y'));
    const yInp=h('input',{type:'number',value:app.settings.pcbHomeY,step:'0.001',
      style:{width:'80px',background:C.bg,color:C.text,border:`1px solid ${C.border}`,
        borderRadius:'4px',padding:'4px 6px',fontSize:'12px',outline:'none',fontFamily:'inherit'}});
    yInp.addEventListener('input',e=>{app.settings.pcbHomeY=parseFloat(e.target.value)||0;saveSettings();});
    coordRow.appendChild(yInp);
    coordRow.appendChild(h('span',{style:{fontSize:'10px',color:C.muted}},'mm (mach)'));
    pcbSection.appendChild(coordRow);

    // Capture + enable row
    const capRow=h('div',{style:{display:'flex',gap:'5px',alignItems:'center'}});
    capRow.appendChild(mkBtn('📍 Capture MPos',()=>{
      const mpos=app.grbl.MPos||[0,0,0];
      app.settings.pcbHomeX=parseFloat(mpos[0].toFixed(3));
      app.settings.pcbHomeY=parseFloat(mpos[1].toFixed(3));
      app.settings.pcbHomeEnabled=true;
      saveSettings(); render();
      notify(`✓ PCB Home captured: X${app.settings.pcbHomeX} Y${app.settings.pcbHomeY}`,'#f97316');
    },'#f97316',{small:true,disabled:!app.connected}));
    // Enabled toggle
    const enLbl=h('label',{style:{display:'flex',alignItems:'center',gap:'5px',
      fontSize:'11px',color:C.muted,cursor:'pointer',marginLeft:'4px'}});
    const enChk=h('input',{type:'checkbox',style:{cursor:'pointer'}});
    enChk.checked=!!app.settings.pcbHomeEnabled;
    enChk.addEventListener('change',e=>{app.settings.pcbHomeEnabled=e.target.checked;saveSettings();render();});
    enLbl.appendChild(enChk);
    enLbl.appendChild(document.createTextNode('Show PCB Home button'));
    capRow.appendChild(enLbl);
    pcbSection.appendChild(capRow);
    body.appendChild(pcbSection);

    // Header row — $$ loader
    const hdr=h('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'8px'}});
    hdr.appendChild(mkBtn(app.cfgLoading?'⟳ Loading…':'⟳ Load $$',()=>{
      if(!app.connected){addLog('Not connected','err');return;}
      app.cfgSettings={}; app.cfgEdits={}; app.cfgLoading=true;
      write('$$'); addLog('$$','tx'); render();
    },'#94a3b8',{small:true,disabled:!app.connected||app.cfgLoading}));
    hdr.appendChild(mkBtn('✕ Clear',()=>{app.cfgSettings={};app.cfgEdits={};render();},'#64748b',{small:true}));
    body.appendChild(hdr);
    // FluidNC note — most runtime settings are editable, but config.yaml settings return error:162
    body.appendChild(h('div',{style:{fontSize:'10px',color:'#64748b',marginBottom:'8px',
      padding:'4px 6px',background:'#64748b12',borderRadius:'4px',border:'1px solid #64748b20',
      lineHeight:'1.6'}},
      '⚠ Settings that return error:162 are defined in config.yaml and must be edited there — they cannot be changed at runtime.'));

    const keys=Object.keys(app.cfgSettings);
    if(!keys.length){
      body.appendChild(h('div',{style:{fontSize:'11px',color:C.muted,padding:'10px 0',textAlign:'center'}},
        app.connected?'Click Load $$ to read FluidNC settings':'Connect to machine first'));
    } else {
      // Filter input
      const filterInp=h('input',{type:'text',placeholder:'Filter settings…',
        style:{width:'100%',background:C.bg,color:C.text,border:`1px solid ${C.border}`,
          borderRadius:'5px',padding:'5px 8px',fontSize:'11px',outline:'none',
          fontFamily:'inherit',marginBottom:'6px'}});
      let filterVal='';
      filterInp.addEventListener('input',e=>{filterVal=e.target.value.toLowerCase();renderCfg();});
      body.appendChild(filterInp);

      const cfgList=h('div',{id:'cfg-list',style:{overflowY:'auto',maxHeight:'320px'}});
      body.appendChild(cfgList);

      function renderCfg(){
        cfgList.innerHTML='';
        const filtered=keys.filter(k=>!filterVal||k.toLowerCase().includes(filterVal)||
          (app.cfgSettings[k].comment||'').toLowerCase().includes(filterVal));
        filtered.forEach(k=>{
          const {val,comment}=app.cfgSettings[k];
          const row=h('div',{style:{display:'flex',alignItems:'center',gap:'5px',
            padding:'4px 2px',borderBottom:`1px solid ${C.border}20`}});
          // Key label
          row.appendChild(h('span',{style:{fontSize:'10px',color:'#94a3b8',width:'80px',
            flexShrink:'0',fontWeight:'600',overflow:'hidden',textOverflow:'ellipsis',
            whiteSpace:'nowrap'},title:k},'$'+k));
          // Edit input
          const inp=h('input',{type:'text',value:app.cfgEdits[k]!==undefined?app.cfgEdits[k]:val,
            style:{flex:'1',minWidth:'0',background:C.bg,color:
              app.cfgEdits[k]!==undefined&&app.cfgEdits[k]!==val?'#f59e0b':C.text,
              border:`1px solid ${app.cfgEdits[k]!==undefined&&app.cfgEdits[k]!==val?'#f59e0b50':C.border}`,
              borderRadius:'4px',padding:'3px 5px',fontSize:'11px',outline:'none',fontFamily:'inherit'}});
          inp.addEventListener('input',e=>{
            app.cfgEdits[k]=e.target.value;
            inp.style.color=e.target.value!==val?'#f59e0b':C.text;
            inp.style.borderColor=e.target.value!==val?'#f59e0b50':C.border;
          });
          row.appendChild(inp);
          // Send button
          row.appendChild(h('button',{
            style:{background:'transparent',border:`1px solid #94a3b840`,color:'#94a3b8',
              borderRadius:'4px',padding:'3px 6px',fontSize:'10px',cursor:'pointer',
              fontFamily:'inherit',flexShrink:'0'},
            onClick:()=>{
              const nv=inp.value.trim(); if(!nv) return;
              const cmd=`$${k}=${nv}`;
              write(cmd); addLog(cmd,'tx');
              app.cfgSettings[k]={val:nv,comment};
              delete app.cfgEdits[k];
              inp.style.color=C.text; inp.style.borderColor=C.border;
              notify(`✓ ${cmd}`,'#94a3b8');
            }
          },'✓'));
          // Comment tooltip
          if(comment) row.appendChild(h('span',{style:{fontSize:'9px',color:C.muted,
            maxWidth:'80px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
            flexShrink:'0'},title:comment},comment));
          cfgList.appendChild(row);
        });
