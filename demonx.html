    e.preventDefault();e.stopPropagation();
  });
  panel.appendChild(grip);
  return panel;
}

// ── GCODE VISUALIZER ────────────────────────────────────────────────────────
function parseGcodePaths(lines) {
  let cx=0,cy=0,cz=0,abs=true;
  const paths=[]; // [{type:'rapid'|'cut'|'arc', pts:[{x,y,z}]}]
  let cur=null, curType=null;

  function flush(){ if(cur&&cur.pts.length>1) paths.push(cur); cur=null; curType=null; }
  function startSeg(type){
    if(curType!==type){ flush(); cur={type,pts:[{x:cx,y:cy,z:cz}]}; curType=type; }
  }
  function extendSeg(nx,ny,nz){
    if(!cur) return;
    cur.pts.push({x:nx,y:ny,z:nz});
  }

  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;

  for(const raw of lines){
    const line=raw.toUpperCase().replace(/\s/g,'').split(';')[0];
    if(!line) continue;
    if(line.includes('G91')) abs=false;
    if(line.includes('G90')) abs=true;

    const hasMove=/[XY]/.test(line);
    const isG0=/G0*0(?![0-9])/.test(line);
    const isG1=/G0*1(?![0-9])/.test(line);
    const isG2=/G0*2(?![0-9])/.test(line);
    const isG3=/G0*3(?![0-9])/.test(line);

    if(!hasMove&&!isG0&&!isG1&&!isG2&&!isG3) continue;

    const xm=line.match(/X(-?\d+\.?\d*(?:[eE][+-]?\d+)?)/);
    const ym=line.match(/Y(-?\d+\.?\d*(?:[eE][+-]?\d+)?)/);
    const zm=line.match(/Z(-?\d+\.?\d*(?:[eE][+-]?\d+)?)/);

    const nx=xm?(abs?parseFloat(xm[1]):cx+parseFloat(xm[1])):cx;
    const ny=ym?(abs?parseFloat(ym[1]):cy+parseFloat(ym[1])):cy;
    const nz=zm?(abs?parseFloat(zm[1]):cz+parseFloat(zm[1])):cz;

    if(isG2||isG3){
      const im=line.match(/I(-?\d+\.?\d*)/),jm=line.match(/J(-?\d+\.?\d*)/);
      const ii=im?parseFloat(im[1]):0, jj=jm?parseFloat(jm[1]):0;
      const arcPts=approximateArc(cx,cy,nx,ny,ii,jj,isG3);
      startSeg('cut');
      arcPts.forEach(pt=>{ extendSeg(pt.x,pt.y,nz); minX=Math.min(minX,pt.x);maxX=Math.max(maxX,pt.x);minY=Math.min(minY,pt.y);maxY=Math.max(maxY,pt.y); });
    } else if(isG1){
      startSeg('cut');
      extendSeg(nx,ny,nz);
    } else {
      startSeg('rapid');
      extendSeg(nx,ny,nz);
    }
    minX=Math.min(minX,nx);maxX=Math.max(maxX,nx);
    minY=Math.min(minY,ny);maxY=Math.max(maxY,ny);
    cx=nx; cy=ny; cz=nz;
  }
  flush();
  app.vizBounds={minX:isFinite(minX)?minX:0,maxX:isFinite(maxX)?maxX:100,
    minY:isFinite(minY)?minY:0,maxY:isFinite(maxY)?maxY:100};
  return paths;
}

function approximateArc(x1,y1,x2,y2,i,j,ccw,segs=24){
  const cx=x1+i, cy=y1+j;
  const r=Math.sqrt(i*i+j*j);
  let a1=Math.atan2(y1-cy,x1-cx);
  let a2=Math.atan2(y2-cy,x2-cx);
  if(ccw){ if(a2<a1) a2+=Math.PI*2; }
  else   { if(a2>a1) a2-=Math.PI*2; }
  const pts=[];
  for(let s=1;s<=segs;s++){
    const t=s/segs, a=a1+(a2-a1)*t;
    pts.push({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)});
  }
  return pts;
}

function drawVisualizer(canvas, paths, bounds, progress){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=C.bg;
  ctx.fillRect(0,0,W,H);

  if(!paths||!paths.length){
    ctx.fillStyle='#4a5a6a'; ctx.font='12px monospace'; ctx.textAlign='center';
    ctx.fillText('Load a G-code file to preview',W/2,H/2);
    return;
  }

  const pad=20;
  const rngX=bounds.maxX-bounds.minX||1;
  const rngY=bounds.maxY-bounds.minY||1;

  // Compute base scale to fit whole job with padding
  const baseScaleX=(W-pad*2)/rngX;
  const baseScaleY=(H-pad*2)/rngY;
  const baseScale=Math.min(baseScaleX,baseScaleY);

  // Auto-fit once when a new file loads
  if(!app.vizFitted){
    app.vizZoom=1;
    app.vizPanX=(W-pad*2-rngX*baseScale)/2 + pad - bounds.minX*baseScale;
    app.vizPanY=(H-pad*2-rngY*baseScale)/2 + pad + bounds.maxY*baseScale;
    app.vizFitted=true;
  }

  const scale=baseScale*app.vizZoom;
  const offX=app.vizPanX;
  const offY=app.vizPanY;

  function tx(x){ return offX+x*scale; }
  function ty(y){ return offY-y*scale; }

  // World-to-canvas for bounds checking
  const x0=tx(bounds.minX)-20, x1=tx(bounds.maxX)+20;
  const y0=ty(bounds.maxY)-20, y1=ty(bounds.minY)+20;

  // Grid — subtle, theme-aware
  const gridAlpha=currentTheme==='light'?'18':'12';
  ctx.strokeStyle=currentTheme==='light'?`rgba(100,120,150,0.12)`:`rgba(100,140,200,0.1)`;
  ctx.lineWidth=0.5;
  const rawStep=rngX/(4*app.vizZoom);
  const gridStep=Math.pow(10,Math.floor(Math.log10(Math.max(rawStep,0.001))));
  const gStart=Math.max(bounds.minX-gridStep, bounds.minX-gridStep);
  for(let gx=Math.floor(bounds.minX/gridStep)*gridStep; gx<=bounds.maxX+gridStep; gx+=gridStep){
    const sx=tx(gx); if(sx<-5||sx>W+5) continue;
    ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
  }
  for(let gy=Math.floor(bounds.minY/gridStep)*gridStep; gy<=bounds.maxY+gridStep; gy+=gridStep){
    const sy=ty(gy); if(sy<-5||sy>H+5) continue;
    ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();
  }

  // Paths — calculate progress cutoff
  let totalPts=0; paths.forEach(s=>totalPts+=s.pts.length);
  const donePts=Math.round(progress/100*totalPts);
  let countedPts=0;

  for(const seg of paths){
    const isRapid=seg.type==='rapid';
    const segStart=countedPts;
    countedPts+=seg.pts.length;
    const isPast=donePts>=countedPts;
    const isPartial=!isPast&&donePts>segStart;

    ctx.strokeStyle=isRapid
      ? (isPast?'#1e4a6a':'#1e3a5a')
      : (isPast?'#22c55e':'#818cf8');
    ctx.lineWidth=isRapid?0.6:1.2;
    ctx.setLineDash(isRapid?[3,3]:[]);

    const drawTo=isPartial?donePts-segStart:seg.pts.length;
    ctx.beginPath();
    ctx.moveTo(tx(seg.pts[0].x),ty(seg.pts[0].y));
    for(let i=1;i<drawTo;i++) ctx.lineTo(tx(seg.pts[i].x),ty(seg.pts[i].y));
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Tool position dot
  const mpos=app.grbl.MPos||[0,0,0];
  const wco=app.grbl.WCO||[0,0,0];
  const wx=mpos[0]-wco[0], wy=mpos[1]-wco[1];
  if(app.connected){
    const ptx=tx(wx), pty=ty(wy);
    ctx.beginPath(); ctx.arc(ptx,pty,6,0,Math.PI*2);
    ctx.fillStyle='#ef4444'; ctx.fill();
    ctx.beginPath(); ctx.arc(ptx,pty,10,0,Math.PI*2);
    ctx.strokeStyle='#ef444460'; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle='#ef444430'; ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(ptx,0);ctx.lineTo(ptx,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,pty);ctx.lineTo(W,pty);ctx.stroke();
  }

  // Work origin dot
  ctx.beginPath(); ctx.arc(tx(0),ty(0),4,0,Math.PI*2);
  ctx.fillStyle='#f59e0b'; ctx.fill();

  // Axis labels — current zoom-aware grid step
  ctx.fillStyle='#4a5a6a'; ctx.font='9px monospace';
  ctx.textAlign='left';
  ctx.fillText(`X${bounds.minX.toFixed(1)} Y${bounds.minY.toFixed(1)}`,4,H-4);
  ctx.textAlign='right';
  ctx.fillText(`${(rngX).toFixed(1)}×${(rngY).toFixed(1)}mm  ${app.vizZoom.toFixed(1)}×`,W-4,H-4);
}

function buildVisualizerPanel(p){
  const hasH=p.h!==null&&p.h!==undefined;
  const isCollapsed=!!p.collapsed;
  const panel=h('div',{style:{
    position:'absolute',left:p.x+'px',top:p.y+'px',width:p.w+'px',
    ...(hasH&&!isCollapsed?{height:p.h+'px'}:{}),
    background:C.surface,border:`1px solid ${p.accent}22`,borderRadius:'8px',
    boxShadow:'0 8px 32px rgba(0,0,0,0.5)',...(!isCollapsed?{overflow:'hidden'}:{})}});

  const tb=h('div',{
    style:{background:`${p.accent}14`,borderBottom:`1px solid ${p.accent}28`,
      padding:'7px 12px',cursor:'grab',display:'flex',alignItems:'center',
      justifyContent:'space-between',flexShrink:'0',
      borderRadius:isCollapsed?'8px':'8px 8px 0 0'},
    onMousedown:e=>{
      app.drag=p.id;
      app.dragOff={x:e.clientX-p.x,y:e.clientY-p.y};
      document.body.style.cursor='grabbing';
      e.preventDefault();
    }
  },
    h('span',{style:{fontSize:'10px',fontWeight:'700',color:p.accent,letterSpacing:'0.12em',pointerEvents:'none'}},p.title),
    h('div',{style:{display:'flex',gap:'6px',alignItems:'center'}},
      h('span',{style:{color:`${p.accent}50`,fontSize:'10px',pointerEvents:'none'}},
        isCollapsed?'':' scroll=zoom  drag=pan'),
      h('button',{
        style:{background:'transparent',border:'none',color:`${p.accent}80`,
          fontSize:'14px',lineHeight:'1',cursor:'pointer',padding:'0 2px',fontFamily:'inherit'},
        onMousedown:e=>e.stopPropagation(),
        onClick:e=>{
          e.stopPropagation();
          const i=app.panels.findIndex(q=>q.id===p.id);
          if(i>=0){app.panels[i]={...app.panels[i],collapsed:!app.panels[i].collapsed};savePanels();render();}
        }
      },isCollapsed?'▶':'▼')
    )
  );
  panel.appendChild(tb);
  if(isCollapsed) return panel;

  const infoH=20;
  const canH=hasH ? Math.max(80, p.h-34-infoH) : Math.round(p.w*0.75);
  const canvas=document.createElement('canvas');
  canvas.id='viz-canvas';
  canvas.style.cssText=`display:block;width:100%;height:${canH}px;cursor:crosshair;`;

  // ── Wheel zoom ────────────────────────────────────────────────────────
  canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    // Convert mouse position to world coords before zoom
    const scaleOld=(Math.min((canvas.width-40)/(app.vizBounds.maxX-app.vizBounds.minX||1),
                              (canvas.height-40)/(app.vizBounds.maxY-app.vizBounds.minY||1)))*app.vizZoom;
    const wx=(mx-app.vizPanX)/scaleOld;
    const wy=(app.vizPanY-my)/scaleOld;

    const factor=e.deltaY<0?1.15:1/1.15;
    app.vizZoom=Math.max(0.3,Math.min(100,app.vizZoom*factor));

    const scaleNew=(Math.min((canvas.width-40)/(app.vizBounds.maxX-app.vizBounds.minX||1),
                              (canvas.height-40)/(app.vizBounds.maxY-app.vizBounds.minY||1)))*app.vizZoom;
    // Adjust pan so point under mouse stays fixed
    app.vizPanX=mx-wx*scaleNew;
    app.vizPanY=my+wy*scaleNew;

    drawVisualizer(canvas, app.vizPaths, app.vizBounds, app.progress);
  },{passive:false});

  // ── Canvas pan (middle mouse or left drag inside canvas) ──────────────
  let isPanning=false, panStart={x:0,y:0}, panOrigin={x:0,y:0};
  canvas.addEventListener('mousedown',e=>{
    // Left click inside canvas = pan (but don't interfere with panel drag on titlebar)
    if(e.button===0||e.button===1){
      isPanning=true;
      panStart={x:e.clientX,y:e.clientY};
      panOrigin={x:app.vizPanX,y:app.vizPanY};
      canvas.style.cursor='grabbing';
      e.stopPropagation(); // don't start panel drag
    }
  });
  document.addEventListener('mousemove', e=>{
    if(!isPanning) return;
    app.vizPanX=panOrigin.x+(e.clientX-panStart.x);
    app.vizPanY=panOrigin.y+(e.clientY-panStart.y);
    drawVisualizer(canvas, app.vizPaths, app.vizBounds, app.progress);
  });
  document.addEventListener('mouseup', e=>{
    if(isPanning){ isPanning=false; canvas.style.cursor='crosshair'; }
  });

  panel.appendChild(canvas);

  // Info bar
  const info=h('div',{style:{padding:'3px 10px',fontSize:'9px',color:C.muted,
    display:'flex',gap:'12px',borderTop:`1px solid ${C.border}`,
    background:C.bg,flexShrink:'0',height:infoH+'px',alignItems:'center'}});
  const mpos=app.grbl.MPos||[0,0,0];
  const wco=app.grbl.WCO||[0,0,0];
  info.appendChild(h('span',{},`W: X${(mpos[0]-wco[0]).toFixed(2)} Y${(mpos[1]-wco[1]).toFixed(2)}`));
  if(app.vizPaths.length){
    const b=app.vizBounds;
    info.appendChild(h('span',{},`${(b.maxX-b.minX).toFixed(1)}×${(b.maxY-b.minY).toFixed(1)}mm`));
    info.appendChild(h('span',{style:{color:'#818cf8'}},`${app.vizPaths.filter(s=>s.type==='cut').length} cuts`));
    info.appendChild(h('span',{style:{color:app.autolevel.enabled&&app.autolevel.measured?'#06b6d4':C.muted}},
      app.autolevel.enabled&&app.autolevel.measured?'AL ✓':'AL off'));
  }
  // Fit button
  const fitBtn=h('button',{style:{marginLeft:'auto',background:'transparent',
    border:`1px solid ${p.accent}40`,color:p.accent,borderRadius:'4px',
    padding:'1px 7px',fontSize:'9px',cursor:'pointer',fontFamily:'inherit'},
    onClick:()=>{ app.vizFitted=false; drawVisualizer(canvas, app.vizPaths, app.vizBounds, app.progress); }
  },'⊡ fit');
  info.appendChild(fitBtn);
  panel.appendChild(info);

  // Resize grip
  const grip=h('div',{style:{position:'absolute',bottom:'3px',right:'3px',
    width:'14px',height:'14px',cursor:'se-resize',color:p.accent,opacity:'0.35',
    fontSize:'11px',lineHeight:'14px',textAlign:'center',pointerEvents:'auto'}},'◢');
  grip.addEventListener('mousedown',e=>{
    app.resize=p.id;
    app.resizeStart={x:e.clientX,y:e.clientY,w:p.w,h:p.h!==null?p.h:(panel.offsetHeight||300)};
    document.body.style.cursor='se-resize';
    e.preventDefault(); e.stopPropagation();
  });
  panel.appendChild(grip);

  // Draw after DOM layout so offsetWidth is real
  requestAnimationFrame(()=>{
    canvas.width=canvas.offsetWidth||p.w;
    canvas.height=canH;
    drawVisualizer(canvas, app.vizPaths, app.vizBounds, app.progress);
  });

  return panel;
}

      if(!base){addLog('Enter cam IP or URL','err');render();return;}
      const user=app.camRtspUser.trim();
      const pass=app.camRtspPass.trim();
      const cred=(user&&pass)?`${encodeURIComponent(user)}:${encodeURIComponent(pass)}@`:'';

      if(base.startsWith('rtsp://')){
        // Full URL entered — inject credentials if provided and not already present
        if(cred && !base.includes('@')){
          base=base.replace('rtsp://','rtsp://'+cred);
        }
      } else {
        // IP-only entered — build full URL
        const path=app._reolinkPath||'/h264Preview_01_sub';
        base=`rtsp://${cred}${base}:554${path}`;
      }
      addLog(`Connecting cam: ${base.replace(/:[^@]+@/,':***@')}`,'sys');
      app.camProxyUrl=`/cam/proxy?url=${encodeURIComponent(base)}`;
      app.camError=false;
      // Persist cam settings
      try{ localStorage.setItem(LS.cam, JSON.stringify({
        url:app.camRtspUrl.trim(), user:app.camRtspUser.trim(),
        pass:app.camRtspPass.trim(), path:app._reolinkPath||'/h264Preview_01_sub'
      })); }catch(_){}
      render();
    },'#f472b6',{full:true}));

  } else {
    // Local/direct MJPEG URL fallback
    body.appendChild(h('div',{style:{fontSize:'10px',color:'#f59e0b',marginBottom:'4px',
      padding:'6px',background:'#f59e0b10',border:'1px solid #f59e0b30',borderRadius:'5px'}},'⚠ RTSP requires server mode (start.bat). Direct MJPEG URL only in local mode.'));
    const urlRow=h('div',{style:{display:'flex',gap:'6px',marginBottom:'4px'}});
    const urlInp2=h('input',{type:'text',value:app.camProxyUrl,
      placeholder:'http://cam-ip/mjpeg  or  /stream',
      style:{flex:'1',background:C.bg,color:C.text,border:`1px solid ${C.border}`,
        borderRadius:'5px',padding:'5px 8px',fontSize:'11px',outline:'none'}});
    urlInp2.addEventListener('input',e=>{app.camProxyUrl=e.target.value;});
    urlRow.appendChild(urlInp2);
    urlRow.appendChild(mkBtn('Load',()=>{app.camError=false;render();},'#f472b6',{small:true}));
    body.appendChild(urlRow);
  }

  // Stream display
  const streamH=hasH?Math.max(80,p.h-34-130):120;
  const streamWrap=h('div',{style:{flex:'1',background:C.bg,borderRadius:'6px',
    overflow:'hidden',position:'relative',minHeight:streamH+'px',
    display:'flex',alignItems:'center',justifyContent:'center'}});

  if(app.camProxyUrl&&!app.camError){
    const img=h('img',{src:app.camProxyUrl,
      style:{width:'100%',height:'100%',objectFit:'contain',display:'block'}});
    img.addEventListener('error',()=>{app.camError=true;render();});
    streamWrap.appendChild(img);
    // OSD overlay
    const ov=h('div',{style:{position:'absolute',top:'6px',left:'6px',
      background:'rgba(0,0,0,0.65)',borderRadius:'4px',padding:'3px 8px',
      fontSize:'10px',color:'#c8d4e4',pointerEvents:'none',fontFamily:'monospace'}});
    const sc=STATE_COLOR[app.grbl.state]||'#334155';
    const mpos=app.grbl.MPos||[0,0,0],wco=app.grbl.WCO||[0,0,0];
    ov.innerHTML=`<span style="color:${sc};font-weight:700">${app.grbl.state}</span>  `+
      `X${(mpos[0]-wco[0]).toFixed(2)} Y${(mpos[1]-wco[1]).toFixed(2)} Z${(mpos[2]-wco[2]).toFixed(2)}`;
    streamWrap.appendChild(ov);
    // Stop button
    const stopCam=h('button',{style:{position:'absolute',top:'6px',right:'6px',
      background:'rgba(0,0,0,0.65)',border:'1px solid #ef444460',color:'#ef4444',
      borderRadius:'4px',padding:'2px 7px',fontSize:'10px',cursor:'pointer',fontFamily:'inherit'},
      onClick:()=>{app.camProxyUrl='';app.camError=false;render();}
    },'✕');
    streamWrap.appendChild(stopCam);
  } else if(app.camError){
    streamWrap.appendChild(h('div',{style:{textAlign:'center',color:'#ef4444',
      fontSize:'11px',padding:'16px',lineHeight:'1.8'}},
      '⚠ Stream error\n'+
      (isServerMode?'Check IP, credentials, and ffmpeg in PATH':'Check URL and CORS')));
  } else {
    const ph=h('div',{style:{textAlign:'center',color:C.muted,fontSize:'11px',lineHeight:'2'}});
    ph.innerHTML='📷 No stream<br><span style="font-size:10px">'+
      (isServerMode?'Enter Reolink IP + credentials above':'Enter MJPEG URL above')+'</span>';
    streamWrap.appendChild(ph);
  }
  body.appendChild(streamWrap);
  panel.appendChild(body);

  // Resize grip
  const grip=h('div',{style:{position:'absolute',bottom:'3px',right:'3px',
    width:'14px',height:'14px',cursor:'se-resize',color:p.accent,opacity:'0.35',
    fontSize:'11px',lineHeight:'14px',textAlign:'center',pointerEvents:'auto'}},'◢');
  grip.addEventListener('mousedown',e=>{
    app.resize=p.id;
    app.resizeStart={x:e.clientX,y:e.clientY,w:p.w,h:p.h!==null?p.h:(panel.offsetHeight||280)};
    document.body.style.cursor='se-resize';e.preventDefault();e.stopPropagation();
  });
  panel.appendChild(grip);
  return panel;
}

// ── PARTIAL RENDERS (no DOM rebuild — prevents input flicker) ────────────────
function renderLive(){
  // Update status coords in-place
  const mpos=app.grbl.MPos||[0,0,0];
  const wco=app.grbl.WCO||[0,0,0];
  const wpos=mpos.map((v,i)=>v-wco[i]);
  const sc=STATE_COLOR[app.grbl.state]||'#334155';
  const feed=(app.grbl.FS||[0,0])[0], rpm=(app.grbl.FS||[0,0])[1];
  ['wx','wy','wz'].forEach((id,i)=>{
    const el=document.getElementById(id); if(el) el.textContent=wpos[i].toFixed(3);
  });
  ['mx','my','mz'].forEach((id,i)=>{
    const el=document.getElementById(id); if(el) el.textContent=mpos[i].toFixed(3);
  });
  const stateEl=document.getElementById('grbl-state');
  if(stateEl){ stateEl.textContent=app.grbl.state; stateEl.style.color=sc; }
  const feedEl=document.getElementById('grbl-feed');
  if(feedEl) feedEl.textContent=feed;
  const rpmEl=document.getElementById('grbl-rpm');
  if(rpmEl) rpmEl.textContent=rpm;
  // Update spindle panel live RPM
  const sRpmEl=document.getElementById('spindle-rpm-val');
  if(sRpmEl){ sRpmEl.textContent=rpm+''; sRpmEl.style.color=rpm>0?'#f97316':C.muted; }
  const sRpmState=document.getElementById('spindle-rpm-state');
  if(sRpmState){ sRpmState.textContent=rpm>0?'● RUNNING':'■ STOPPED'; sRpmState.style.color=rpm>0?'#22c55e':'#ef4444'; }
  const sRpmBox=document.getElementById('spindle-rpm-box');
  if(sRpmBox) sRpmBox.style.borderColor=rpm>0?'#f9731640':C.border;
  const ovEl=document.getElementById('ov-label');
  if(ovEl){
    const ov=app.grbl.Ov||[100,100,100];
    ovEl.textContent=`OVERRIDES  ·  F:${ov[0]}%  R:${ov[1]}%  S:${ov[2]}%`;
  }
  // Update topbar state dot + text
  const dot=document.getElementById('state-dot');
  if(dot) dot.style.background=sc;
  const stateTop=document.getElementById('state-top');
  if(stateTop){ stateTop.textContent=app.grbl.state.toUpperCase(); stateTop.style.color=sc; }
  const feedTop=document.getElementById('feed-top');
  if(feedTop) feedTop.textContent=`F: ${feed}   S: ${rpm}`;
  // Update Pn (pin state) indicator
  const pnEl=document.getElementById('pn-indicator');
  const pn=app.grbl.Pn||'';
  if(pnEl){
    pnEl.textContent=pn?`Pn:${pn}`:'';
    pnEl.style.color=pn.includes('P')?'#22c55e':pn.length?'#ef4444':C.muted;
    pnEl.style.display=pn?'inline':'none';
  }
  const vizCanvas=document.getElementById('viz-canvas');
  if(vizCanvas&&app.vizPaths.length){
    drawVisualizer(vizCanvas, app.vizPaths, app.vizBounds, app.progress);
  }
}

function renderLog(){
  // Only update console log area, don't rebuild DOM
  const ld=document.getElementById('console-log');
  if(!ld) return;
  ld.innerHTML='';
  app.log.forEach(l=>{
    const d=document.createElement('div');
    d.style.color=l.k==='err'?'#ef4444':l.k==='sys'?C.muted:l.k==='tx'?'#f59e0b':'#7dd3fc';
    d.textContent=(l.k==='tx'?'> ':'')+l.m;
    ld.appendChild(d);
  });
  ld.scrollTop=ld.scrollHeight;
}

// ── RENDER ──────────────────────────────────────────────────────────────────
function render(){
  const root=document.getElementById('root');
  root.innerHTML='';
  root.style.color=C.text;
  const sc=STATE_COLOR[app.grbl.state]||'#334155';
  const feed=(app.grbl.FS||[0,0])[0],rpm=(app.grbl.FS||[0,0])[1];

  // Top bar with PGC branding
  const tb=h('div',{style:{position:'fixed',top:'0',left:'0',right:'0',height:'48px',
    background:currentTheme==='dark'
      ? 'linear-gradient(90deg,rgba(7,10,15,0.97),rgba(11,18,26,0.97))'
      : 'linear-gradient(90deg,rgba(208,218,232,0.97),rgba(216,230,240,0.97))',
    borderBottom:`1px solid rgba(52,209,198,0.22)`,
    boxShadow:'0 2px 20px rgba(52,209,198,0.08)',
    display:'flex',alignItems:'center',padding:'0 14px',gap:'10px',zIndex:'999'}});

  // PGC Logo
  const logoWrap=h('a',{href:'https://www.PricklyGuy.com',target:'_blank',
    style:{display:'flex',alignItems:'center',gap:'8px',textDecoration:'none',
      padding:'3px 8px 3px 3px',borderRadius:'999px',
      background:'rgba(52,209,198,0.06)',border:'1px solid rgba(52,209,198,0.18)',
      backdropFilter:'blur(8px)'}});
  const logoImg=h('img',{src:PGC_LOGO_URL,alt:'PGC',
    style:{width:'34px',height:'34px',borderRadius:'50%',display:'block',
      boxShadow:'0 0 10px rgba(52,209,198,0.4)'}});
  logoImg.onerror=()=>{ logoImg.style.display='none'; };
  logoWrap.appendChild(logoImg);
  logoWrap.appendChild(h('span',{style:{fontSize:'10px',fontWeight:'700',
    color:'rgba(52,209,198,0.9)',letterSpacing:'0.08em',whiteSpace:'nowrap'}},'DEMONX'));
  tb.appendChild(logoWrap);

  tb.appendChild(h('div',{style:{width:'1px',height:'24px',background:'rgba(52,209,198,0.2)'}}));
  const stateDot=h('div',{id:'state-dot',style:{width:'8px',height:'8px',borderRadius:'50%',background:sc}});
  tb.appendChild(stateDot);
  const stateLabel=h('span',{id:'state-top',style:{fontSize:'11px',fontWeight:'700',color:sc,letterSpacing:'0.1em'}},app.grbl.state.toUpperCase());
  tb.appendChild(stateLabel);
  tb.appendChild(h('div',{style:{width:'1px',height:'20px',background:'rgba(52,209,198,0.15)'}}));
  tb.appendChild(mkBtn('⌂ HOME',()=>{app.homing=true;write('$H');addLog('$H','tx');},'#06b6d4',{small:true,disabled:!app.connected}));
  tb.appendChild(mkBtn('🔓 UNLOCK',()=>{write('$X');addLog('$X','tx');render();},'#a855f7',{small:true,disabled:!app.connected}));
  if(app.connected&&app.sending) tb.appendChild(h('span',{style:{fontSize:'10px',color:'#a855f7'}},`▶ ${app.progress}%`));
  if(app.connected&&app.autolevel.enabled&&app.autolevel.measured)
    tb.appendChild(h('span',{style:{fontSize:'10px',color:'#06b6d4'}},'⬛ AL'));
  // Live pin state indicator
  const pn=app.grbl.Pn||'';
  const pnSpan=h('span',{id:'pn-indicator',style:{
    fontSize:'10px',fontWeight:'700',display:pn?'inline':'none',
    color:pn.includes('P')?'#22c55e':pn.length?'#ef4444':C.muted,
    background:pn.includes('P')?'rgba(34,197,94,0.12)':'rgba(239,68,68,0.12)',
    border:`1px solid ${pn.includes('P')?'rgba(34,197,94,0.3)':'rgba(239,68,68,0.3)'}`,
    borderRadius:'4px',padding:'2px 6px',
  }},pn?`Pn:${pn}`:'');
  tb.appendChild(pnSpan);
  tb.appendChild(h('div',{style:{flex:'1'}}));
  // HOLD / RESUME / RESET grouped right
  tb.appendChild(mkBtn('⏸ HOLD',()=>write('!',true),'#f59e0b',{small:true,disabled:!app.connected}));
  tb.appendChild(mkBtn('▶ RESUME',()=>write('~',true),'#22c55e',{small:true,disabled:!app.connected}));
  tb.appendChild(mkBtn('⚠ RESET',()=>{write('\x18',true);app.okQueue=[];addLog('⚠ RESET','err');render();},'#ef4444',{small:true,disabled:!app.connected}));
  tb.appendChild(h('div',{style:{width:'1px',height:'20px',background:'rgba(52,209,198,0.15)',margin:'0 4px'}}));
  tb.appendChild(h('span',{id:'feed-top',style:{fontSize:'10px',color:C.muted}},`F: ${feed}   S: ${rpm}`));
  const themeBtn=h('button',{style:{background:'transparent',border:`1px solid rgba(52,209,198,0.25)`,
    color:'rgba(52,209,198,0.7)',borderRadius:'4px',padding:'3px 8px',fontSize:'12px',
    cursor:'pointer',fontFamily:'inherit',marginLeft:'6px'},
    onClick:()=>{ applyTheme(currentTheme==='dark'?'light':'dark'); render(); }
  }, currentTheme==='dark'?'☀':'🌙');
  tb.appendChild(themeBtn);
  const rl=h('button',{style:{background:'transparent',border:`1px solid rgba(52,209,198,0.2)`,
    color:C.muted,borderRadius:'4px',padding:'3px 8px',fontSize:'10px',
    cursor:'pointer',fontFamily:'inherit',marginLeft:'4px'},
    onClick:()=>{app.panels=DEF_PANELS.map(p=>({...p}));savePanels();render();}
  },'⊞ reset');
  tb.appendChild(rl);
  root.appendChild(tb);

  // PGC footer
  let footer=document.getElementById('pgc-footer');
  if(!footer){
    footer=document.createElement('div');
    footer.id='pgc-footer';
    footer.style.cssText=`position:fixed;left:0;right:0;bottom:0;z-index:9998;
      padding:6px 14px;font-size:11px;display:flex;align-items:center;
      justify-content:center;gap:8px;pointer-events:none;
      background:${currentTheme==='dark'?'rgba(7,10,15,0.85)':'rgba(208,218,232,0.9)'};
      border-top:1px solid rgba(52,209,198,0.18);backdrop-filter:blur(8px);`;
    footer.innerHTML=`<span style="color:rgba(52,209,198,0.6);font-size:10px">Powered by</span>
      <a href="https://www.PricklyGuy.com" target="_blank"
        style="color:rgba(52,209,198,0.9);text-decoration:none;font-weight:700;
        font-size:10px;pointer-events:auto;">Prickly Guy Creations</a>
      <span style="color:rgba(52,209,198,0.3)">·</span>
      <span style="color:rgba(52,209,198,0.5);font-size:10px">DemonX CNC Controller</span>`;
    document.body.appendChild(footer);
  }

  // Toast
  if(app.notification){
    root.appendChild(h('div',{style:{position:'absolute',top:'48px',right:'16px',zIndex:'9999',
      background:`${app.notification.color}18`,border:`1px solid ${app.notification.color}55`,
      borderRadius:'8px',padding:'10px 16px',fontSize:'12px',
      color:app.notification.color,fontWeight:'700',maxWidth:'380px'}},app.notification.msg));
  }

  // Canvas — scrollable so panels below viewport are reachable
  const maxY=app.panels.reduce((m,p)=>Math.max(m,(p.y||0)+(p.h||600)),0)+80;
  const canvas=h('div',{style:{position:'absolute',top:'48px',left:'0',right:'0',
    height:`${maxY}px`, minHeight:'calc(100vh - 48px)', overflow:'visible'}});
  app.panels.forEach(p=>{
    if(p.id==='visualizer') canvas.appendChild(buildVisualizerPanel(p));
    else if(p.id==='ipcam') canvas.appendChild(buildCamPanel(p));
    else canvas.appendChild(buildPanel(p));
  });
  root.appendChild(canvas);
  // Make root itself scrollable
  root.style.overflow='auto';
  root.style.height='100%';
  document.body.style.overflow='hidden';
}

render();
</script>
</body>
